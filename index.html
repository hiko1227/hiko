<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>星空個人 Dashboard - 欣安邨版</title>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: rgba(255, 255, 255, 0.06); 
            --text-main: #f3f4f6; 
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-orange: #f59e0b;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 8px; 
            margin: 0; 
            font-size: 1.15rem;
        }

        .top-header { 
            background: var(--card-bg); 
            padding: 10px 16px; 
            border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.08); 
            max-width: 1200px; 
            margin: 0 auto 8px auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            backdrop-filter: blur(10px);
        }
        
        .clock { font-size: 3rem; font-weight: 800; color: var(--accent-blue); line-height: 1; }
        .date-center { text-align: center; }
        .date-main { font-size: 1.2rem; font-weight: 700; }
        .lunar-main { font-size: 1rem; color: var(--accent-yellow); margin-top: 2px; font-weight: 600; }

        .main-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 8px; max-width: 1200px; margin: auto; }
        .panel { 
            background: var(--card-bg); 
            padding: 12px 16px; 
            border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.08); 
            backdrop-filter: blur(10px);
            margin-bottom: 8px;
        }
        .panel-title { 
            font-size: 1.2rem; color: var(--accent-green); font-weight: 700; margin-bottom: 10px; 
            border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        
        .wx-temp-box { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
        .wx-temp { font-size: 2.8rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }
        .forecast-container { margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
        .forecast-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: 8px; font-size: 1rem; font-weight: 600; }

        .transport-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; margin: 6px 0; border-radius: 10px; font-weight: 700; font-size: 1.1rem; background: rgba(255,255,255,0.05); }
        .mtr-up { border-left: 6px solid var(--accent-blue); }
        .mtr-down { border-left: 6px solid var(--accent-purple); }
        .bus-normal { border-left: 6px solid var(--accent-green); }
        .bus-special { border-left: 6px solid var(--accent-orange); background: rgba(245, 158, 11, 0.12); }
        
        .time-val { color: var(--accent-green); font-size: 1.3rem; font-weight: 800; text-align: right; }
        .sub-note { font-size: 0.85rem; color: #9ca3af; font-weight: normal; display: block; }
        
        .memo-input-box { display: flex; gap: 8px; margin-bottom: 8px; }
        .memo-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 1.15rem; outline: none; }
        .memo-btn { background: var(--accent-green); color: #0b0f19; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        
        .memo-list { display: flex; flex-direction: column; gap: 6px; max-height: 120px; overflow-y: auto; }
        .memo-item { background: rgba(0,0,0,0.25); padding: 10px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: 600; }
        .memo-delete { color: #f87171; cursor: pointer; font-size: 1rem; background: none; border: none; font-weight: bold; }
        .refresh-memo-btn { background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.2); padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date-center">
            <div class="date-main" id="date-text">--</div>
            <div class="lunar-main" id="lunar-date">農曆 計算中...</div>
        </div>
    </div>

    <div class="main-grid">
        <div>
            <!-- 天氣面板 -->
            <div class="panel">
                <div class="panel-title"><span>☀️ 馬鞍山氣象</span></div>
                <div class="wx-temp-box">
                    <span class="wx-temp" id="current-temp">--°C</span>
                    <span style="font-size: 2.2rem;">⛅</span>
                </div>
                <div style="margin-top: 4px; font-size: 1rem;">狀況: <span id="current-desc" style="color:var(--accent-blue); font-weight:700;">實時連線中...</span></div>
                
                <div class="forecast-container">
                    <div style="font-size: 0.95rem; color: var(--accent-green); font-weight: 700;">🔮 未來 3 日預報</div>
                    <div class="forecast-row"><span id="fc-date-1">--</span><span id="fc-wx-1">晴間多雲 (27°C - 32°C)</span></div>
                    <div class="forecast-row"><span id="fc-date-2">--</span><span id="fc-wx-2">部分時間有陽光 (26°C - 31°C)</span></div>
                    <div class="forecast-row"><span id="fc-date-3">--</span><span id="fc-wx-3">微雨 / 驟雨 (25°C - 29°C)</span></div>
                </div>
            </div>

            <!-- 雲端備忘錄面板 -->
            <div class="panel">
                <div class="panel-title">
                    <span>📝 雲端備忘錄</span>
                    <button class="refresh-memo-btn" onclick="loadMemosFromCloud()">🔄 同步</button>
                </div>

                <div class="memo-input-box">
                    <input type="text" id="memo-input" class="memo-input" placeholder="輸入備忘..." onkeypress="if(event.key==='Enter')addMemo()">
                    <button class="memo-btn" onclick="addMemo()">新增</button>
                </div>

                <div class="memo-list" id="memo-list">
                    <div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1rem;">正在連接雲端...</div>
                </div>
            </div>
        </div>

        <div>
            <!-- 港鐵面板 -->
            <div class="panel">
                <div class="panel-title">🚇 港鐵恆安站 (屯馬線)</div>
                
                <div class="transport-row mtr-up">
                    <div>往 烏溪沙<span class="sub-note" id="sub-up">查詢中...</span></div>
                    <span class="time-val" id="mtr-up">--</span>
                </div>
                
                <div class="transport-row mtr-down">
                    <div>往 屯門<span class="sub-note" id="sub-down">查詢中...</span></div>
                    <span class="time-val" id="mtr-down">--</span>
                </div>
            </div>

            <!-- 巴士面板 (已加回欣安邨與錦鞍苑) -->
            <div class="panel">
                <div class="panel-title">🚌 官方實時巴士 (89C)</div>
                
                <div class="transport-row bus-special">
                    <div>🔥 錦鞍苑 [特別班次]<span class="sub-note">往觀塘 (早高峰專用)</span></div>
                    <span class="time-val" style="color: var(--accent-orange);" id="k-special">非服務時間</span>
                </div>

                <div class="transport-row bus-normal">
                    <div>錦鞍苑 - 89C<span class="sub-note">往觀塘</span></div>
                    <span class="time-val" id="k-89c">--</span>
                </div>

                <div class="transport-row bus-normal" style="border-left-color: #38bdf8;">
                    <div>欣安邨 - 89C<span class="sub-note">往觀塘</span></div>
                    <span class="time-val" id="hin-89c">--</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.14/lunar.js"></script>

    <script>
        const BIN_ID = "6a87123ada38895dfefbc1ca"; 
        const MASTER_KEY = "$2a$10$HvcOoQBCbmfplG2XSkexuOAFTbJfJzpuucJSOImKmhiM3K//7f5kO";

        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('zh-HK');
            document.getElementById('date-text').textContent = now.toLocaleDateString('zh-HK', {year:'numeric', month:'long', day:'numeric', weekday:'long'});
            
            try {
                const solar = Solar.fromDate(now);
                const lunar = solar.getLunar();
                document.getElementById('lunar-date').textContent = "農曆 " + lunar.getMonthInChinese() + "月" + lunar.getDayInChinese();
            } catch (e) {
                document.getElementById('lunar-date').textContent = "農曆 計算中...";
            }

            document.getElementById('fc-date-1').textContent = getFormattedDate(1);
            document.getElementById('fc-date-2').textContent = getFormattedDate(2);
            document.getElementById('fc-date-3').textContent = getFormattedDate(3);

            const hour = now.getHours();
            if (hour >= 1 && hour < 5) {
                document.getElementById('mtr-up').textContent = '已收車';
                document.getElementById('mtr-down').textContent = '已收車';
                document.getElementById('k-89c').textContent = '已收車';
                document.getElementById('hin-89c').textContent = '已收車';
            }
        }

        function getFormattedDate(daysAhead) {
            const d = new Date();
            d.setDate(d.getDate() + daysAhead);
            return `${d.getMonth() + 1}月${d.getDate()}日`;
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=22.3840&longitude=114.1950&current=temperature_2m,weather_code');
                const data = await res.json();
                if (data && data.current) {
                    document.getElementById('current-temp').textContent = data.current.temperature_2m + '°C';
                    document.getElementById('current-desc').textContent = '沙田氣象站實況正常';
                }
            } catch (e) {
                document.getElementById('current-temp').textContent = '28°C';
                document.getElementById('current-desc').textContent = '離線參考值';
            }
        }

        // 帶有容錯同快取嘅雲端備忘錄讀取
        async function loadMemosFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": MASTER_KEY }
                });
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();
                const memos = data.record;
                if (Array.isArray(memos)) {
                    renderMemos(memos);
                    localStorage.setItem('cached_memos', JSON.stringify(memos)); // 本地備份
                }
            } catch (e) {
                // 如果雲端暫時失敗，嘗試讀取本地快取，避免突然彈紅字
                const cached = localStorage.getItem('cached_memos');
                if (cached) {
                    renderMemos(JSON.parse(cached));
                } else {
                    document.getElementById('memo-list').innerHTML = '<div style="color: #f87171; text-align: center; padding: 6px; font-size: 1rem;">雲端連線中... (將自動重試)</div>';
                }
            }
        }

        async function saveMemosToCloud(memos) {
            localStorage.setItem('cached_memos', JSON.stringify(memos)); // 先存本地
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 
                        "Content-Type": "application/json",
                        "X-Master-Key": MASTER_KEY 
                    },
                    body: JSON.stringify(memos)
                });
            } catch (e) {
                // 背景靜默失敗，唔會阻礙用戶使用
            }
        }

        function renderMemos(memos) {
            const listEl = document.getElementById('memo-list');
            if (memos.length === 0) {
                listEl.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1rem;">目前沒有備忘</div>';
                return;
            }
            listEl.innerHTML = memos.map((text, index) => `
                <div class="memo-item">
                    <span>• ${text}</span>
                    <button class="memo-delete" onclick="deleteMemo(${index})">刪除</button>
                </div>
            `).join('');
            window.currentMemos = memos; 
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            const val = input.value.trim();
            if (!val) return;

            let memos = window.currentMemos || [];
            memos.push(val);
            input.value = '';
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function deleteMemo(index) {
            let memos = window.currentMemos || [];
            memos.splice(index, 1);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000);
        setInterval(loadMemosFromCloud, 30000); 

        updateTime(); 
        fetchWeather();
        loadMemosFromCloud(); 
    </script>
</body>
</html>
