<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>3008 Tablet Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    <style>
      :root { 
    --bg-color: #0b0f19; 
    --card-bg: rgba(255, 255, 255, 0.045); 
    --text-main: #f3f4f6; 
    --accent-blue: #60a5fa;
    --accent-green: #34d399;
    --accent-yellow: #fbbf24;
    --accent-purple: #c084fc;
    --accent-orange: #f59e0b;
    --accent-red: #f87171;
    --accent-pink: #f472b6;
    --sub-text: #9ca3af;
    --box-bg: rgba(0, 0, 0, 0.35);
    --border-color: rgba(52, 211, 153, 0.2);
    --btn-gray: rgba(255,255,255,0.08);
}

/* 🎨 全新調校：乾淨極簡 Light Mode */
body.light-mode {
    --bg-color: #f4f6f9;
    --card-bg: #ffffff;
    --text-main: #1e293b;         /* 深灰黑，比純黑更高級 */
    --accent-blue: #2563eb;        /* 質感皇家藍 */
    --accent-green: #059669;       /* 翡翠綠 */
    --accent-yellow: #d97706;      /* 暖陽橙黃（不再呈泥土啡色） */
    --accent-purple: #7c3aed;
    --accent-orange: #ea580c;
    --accent-red: #dc2626;
    --accent-pink: #db2777;
    --sub-text: #64748b;
    --box-bg: #f8fafc;
    --border-color: #e2e8f0;       /* 柔和淺灰邊框 */
    --btn-gray: #e2e8f0;
}

body { 
    background-color: var(--bg-color); 
    color: var(--text-main); 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    padding: 12px; 
    margin: 0; 
    font-size: 1.1rem; 
    transition: background-color 0.3s ease, color 0.3s ease;
    -webkit-font-smoothing: antialiased;
}

.main-grid { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 12px; 
    max-width: 1280px; 
    margin: auto; 
} 

.panel { 
    background: var(--card-bg); 
    padding: 16px; 
    border-radius: 16px; 
    border: 1px solid var(--border-color); 
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.panel-top-left { justify-content: center; }

.theme-toggle-btn {
    background: var(--box-bg);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1.1rem;
}

/* 時鐘與數字：Light Mode 採用高清深藍/藍黑，不再用刺眼黃/啡色 */
.clock { 
    font-size: 3.4rem; 
    font-weight: 800; 
    color: var(--accent-yellow); 
    line-height: 1; 
}
body.light-mode .clock,
body.light-mode .wx-temp {
    color: #0f172a; /* 淺色模式下時鐘與溫度改用深藍黑色，醒目又現代 */
}

body:not(.light-mode) .clock {
    text-shadow: 0 0 16px rgba(251,191,36,0.3);
}

.ampm { font-size: 1.2rem; font-weight: 700; color: var(--accent-orange); text-transform: uppercase; }

.wx-box { display: flex; align-items: center; justify-content: space-between; }
.wx-temp { font-size: 2.8rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }

.warning-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.warning-badge {
    background: rgba(248, 113, 113, 0.15);
    color: var(--accent-red);
    border: 1px solid var(--accent-red);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: bold;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

/* 備忘錄樣式修飾 */
.memo-input-box { display: flex; gap: 8px; margin-bottom: 8px; }
.memo-input { 
    flex: 1; 
    background: var(--box-bg); 
    border: 1px solid var(--border-color); 
    padding: 10px 14px; 
    border-radius: 10px; 
    color: var(--text-main); 
    font-size: 1.2rem; 
    outline: none; 
}
.memo-btn { 
    background: var(--accent-blue); /* 統一主要按鈕為藍色 */
    color: #ffffff; 
    border: none; 
    padding: 0 20px; 
    border-radius: 10px; 
    font-weight: bold; 
    font-size: 1.15rem; 
    cursor: pointer; 
}

.memo-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
.memo-item { 
    background: var(--box-bg); 
    padding: 10px 14px; 
    border-radius: 10px; 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    font-size: 1.25rem; 
    font-weight: 600; 
    gap: 10px; 
    border: 1px solid var(--border-color); 
}

.memo-actions { display: flex; gap: 6px; }
.memo-action-btn { 
    background: var(--btn-gray); 
    color: var(--text-main); 
    border: none; 
    padding: 4px 8px; 
    border-radius: 6px; 
    cursor: pointer; 
    font-size: 1rem; 
}
.memo-delete { color: var(--accent-red); background: none; border: none; font-weight: bold; cursor: pointer; font-size: 1.3rem; padding: 0 6px; }

.refresh-memo-btn { background: var(--box-bg); color: var(--sub-text); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; font-size: 1rem; cursor: pointer; }

/* 交通卡片 */
.transit-container { display: flex; flex-direction: column; gap: 10px; }

.mtr-grid-4x1 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mtr-card-4x1, .bus-card-box {
    background: var(--box-bg);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    min-height: 95px;
}

.bus-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.route-badge { 
    font-size: 1.2rem; 
    font-weight: 900; 
    color: var(--accent-blue); 
    background: rgba(37, 99, 235, 0.08); 
    padding: 3px 10px; 
    border-radius: 6px; 
    border: 1px solid var(--accent-blue); 
}

.transit-input-box { display: flex; gap: 8px; margin-bottom: 4px; }
.transit-input { background: var(--box-bg); border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 8px; color: var(--text-main); font-size: 1.1rem; outline: none; }
.transit-add-btn { background: var(--accent-blue); color: #ffffff; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; white-space: nowrap; }

.status-pill { font-size: 0.9rem; padding: 2px 6px; border-radius: 6px; font-weight: bold; }
.pill-active-special { background: rgba(219, 39, 119, 0.12); color: var(--accent-pink); border: 1px solid var(--accent-pink); }
.pill-active-normal { background: rgba(5, 150, 105, 0.12); color: var(--accent-green); border: 1px solid var(--accent-green); }

/* 隱藏滾動條但保持滾動功能，解決右側卡位問題 */
#bus-eta-list::-webkit-scrollbar, .memo-list::-webkit-scrollbar {
    width: 4px;
}
#bus-eta-list::-webkit-scrollbar-thumb, .memo-list::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
}

@media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <div class="main-grid">
        <!-- 左上：日期、農曆與大時鐘 -->
        <div class="panel panel-top-left">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <div style="display: flex; align-items: baseline; gap: 12px;">
                    <span class="date-part" id="date-part" style="font-size: 1.4rem; font-weight: 800;">--</span>
                    <span class="weekday-part" id="weekday-part" style="font-size: 1.4rem; font-weight: 800; color: var(--accent-blue);">--</span>
                </div>
                <button class="theme-toggle-btn" onclick="toggleTheme()" title="切換 Light / Dark 模式">🌓</button>
            </div>

            <div id="lunar-info" style="font-size: 1.15rem; color: var(--accent-purple); font-weight: bold; text-align: center; background: var(--box-bg); padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color);">
                載入農曆中...
            </div>
            
            <div style="text-align: center; margin-top: 10px;">
                <div style="display: flex; align-items: baseline; justify-content: center; gap: 10px;">
                    <span class="clock" id="clock">00:00:00</span>
                    <span class="ampm" id="ampm">--</span>
                </div>
            </div>
        </div>

        <!-- 右上：天氣資訊與假期倒數 -->
        <div class="panel">
            <div class="wx-box">
                <div style="display: flex; align-items: center; gap: 18px;">
                    <img id="wx-icon-img" src="" alt="天氣圖示" style="width: 64px; height: 64px; display: none;" onerror="this.style.display='none'">
                    <div>
                        <div style="display: flex; align-items: baseline; gap: 8px;">
                            <span class="wx-temp" id="current-temp">--°C</span>
                        </div>
                        <div style="font-size: 1.4rem; font-weight: bold; margin-top: 6px; display: flex; gap: 12px; align-items: center;">
                            <span style="color: var(--accent-blue);">濕度: <span id="current-humidity">--%</span></span>
                            <span style="color: var(--sub-text);">|</span>
                            <span style="color: var(--accent-green);">降雨: <span id="wx-rain">--</span></span>
                        </div>
                    </div>
                </div>
                <div style="text-align: right; font-size: 1.25rem; font-weight: bold; background: var(--box-bg); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color);">
                    <div style="color: var(--accent-orange);">最高: <span id="wx-max">--°C</span></div>
                    <div style="color: var(--accent-blue); margin-top: 4px;">最低: <span id="wx-min">--°C</span></div>
                </div>
            </div>
            
            <div id="weather-warning-box" class="warning-container" style="display: none;"></div>
            
            <div id="holiday-countdown" style="margin-top: auto; background: var(--box-bg); padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border-color);">
                <span style="font-size: 1.05rem; color: var(--sub-text);">計算假期中...</span>
            </div>
        </div>

        <!-- 左下：港鐵恆安站 (4x1 橫排) + 備忘錄 -->
        <div class="panel">
            <div class="transit-container" id="mtr-eta-list">
                <div style="color: var(--sub-text); text-align: center; padding: 10px; font-size: 1.1rem;">載入港鐵實時資料中...</div>
            </div>

            <div style="border-top: 1px solid var(--border-color); padding-top: 12px; margin-top: 6px;">
                <div style="display: flex; justify-content: flex-end; margin-bottom: 8px;">
                    <button class="refresh-memo-btn" onclick="loadMemosFromCloud()">🔄 手動同步雲端</button>
                </div>
                <div class="memo-input-box">
                    <input type="text" id="memo-input" class="memo-input" placeholder="新增備忘事項..." onkeypress="if(event.key==='Enter')addMemo()">
                    <button class="memo-btn" onclick="addMemo()">新增</button>
                </div>
                <div class="memo-list" id="memo-list">
                    <div style="color: var(--sub-text); text-align: center; padding: 6px; font-size: 1.2rem;">正在讀取備忘...</div>
                </div>
            </div>
        </div>

        <!-- 右下：九巴實時到站 -->
        <div class="panel">
            <div class="transit-input-box">
                <input type="text" id="bus-route-input" class="transit-input" style="width: 70px; text-align: center;" placeholder="路線">
                <input type="text" id="bus-stop-input" class="transit-input" style="width: 90px; text-align: center;" placeholder="站ID" value="003345">
                <input type="text" id="bus-name-input" class="transit-input" style="flex: 1;" placeholder="自訂名稱">
                <button class="transit-add-btn" onclick="addBusRoute()">新增</button>
            </div>
            <div class="transit-container" id="bus-eta-list" style="max-height: 360px; overflow-y: auto;">
                <div style="color: var(--sub-text); text-align: center; padding: 10px; font-size: 1.1rem;">載入巴士資料中...</div>
            </div>
        </div>
    </div>

    <script>
        const NPOINT_URL = "https://api.npoint.io/6c4e46cd350165fe37c2";

        function toggleTheme() {
            const body = document.body;
            if (body.classList.contains('light-mode')) {
                body.classList.remove('light-mode');
                localStorage.setItem('theme_mode', 'dark');
            } else {
                body.classList.add('light-mode');
                localStorage.setItem('theme_mode', 'light');
            }
        }

        const savedTheme = localStorage.getItem('theme_mode');
        if (savedTheme === 'light') document.body.classList.add('light-mode');

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${hoursStr}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('date-part').textContent = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric'});
            document.getElementById('weekday-part').textContent = now.toLocaleDateString('zh-HK', {weekday:'long'});

            try {
                if (typeof Solar !== 'undefined') {
                    const solar = Solar.fromDate(now);
                    const lunar = solar.getLunar();
                    const gzYear = lunar.getYearInGanZhi();
                    const shengXiao = lunar.getYearShengXiao();
                    const lunarMonth = lunar.getMonthInChinese();
                    const lunarDay = lunar.getDayInChinese();
                    
                    let jieQi = lunar.getJieQi();
                    if (!jieQi) {
                        const prevJieQi = lunar.getPrevJieQi(true); 
                        if (prevJieQi) jieQi = prevJieQi.getName();
                    }

                    const lunarText = `${gzYear}, ${shengXiao}年${lunarMonth}月${lunarDay} | 節氣: ${jieQi || '--'}`;
                    document.getElementById('lunar-info').textContent = lunarText;
                }
            } catch (e) {}
        }

        // 動態假期倒數計算
        async function updateHolidayCountdown() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const holidays = getFallbackHolidays();

            const upcoming = holidays.map(h => {
                const hDate = new Date(h.date);
                hDate.setHours(0, 0, 0, 0);
                const diffDays = Math.ceil((hDate - today) / (1000 * 60 * 60 * 24));
                return { ...h, diffDays };
            }).filter(h => h.diffDays >= 0).sort((a, b) => a.diffDays - b.diffDays);

            const el = document.getElementById('holiday-countdown');
            if (upcoming.length > 0) {
                const next = upcoming[0];
                let timeText = next.diffDays === 0 ? '就是今天！' : `${next.diffDays} 日後`;
                el.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 1.1rem; color: var(--sub-text);">最近假期: <span style="color: var(--accent-blue); font-weight: bold;">${next.name}</span></span>
                        <span style="font-size: 1.25rem; font-weight: 800; color: var(--accent-yellow);">${timeText}</span>
                    </div>
                `;
            }
        }

        function getFallbackHolidays() {
            return [
                { name: "中秋節翌日", date: "2026-09-26" },
                { name: "國慶日", date: "2026-10-01" },
                { name: "重陽節", date: "2026-10-18" },
                { name: "聖誕節", date: "2026-12-25" },
                { name: "聖誕節後第一個周日", date: "2026-12-26" },
                { name: "元旦", date: "2027-01-01" },
                { name: "農曆年初一", date: "2027-02-06" },
                { name: "農曆年初二", date: "2027-02-07" },
                { name: "農曆年初三", date: "2027-02-08" },
                { name: "耶稣受難節", date: "2027-03-26" },
                { name: "清明節", date: "2027-04-05" }
            ];
        }

        async function fetchWeather() {
            try {
                const tempRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const tempData = await tempRes.json();
                
                if (tempData?.temperature?.data) {
                    const shatin = tempData.temperature.data.find(i => i.place === "沙田");
                    if (shatin) document.getElementById('current-temp').textContent = shatin.value + '°C';
                }

                if (tempData?.humidity?.data) {
                    const shatinHumid = tempData.humidity.data.find(i => i.place === "沙田") || tempData.humidity.data[0];
                    if (shatinHumid) document.getElementById('current-humidity').textContent = shatinHumid.value + '%';
                }

                if (tempData?.icon && tempData.icon.length > 0) {
                    const iconCode = tempData.icon[0];
                    const iconImg = document.getElementById('wx-icon-img');
                    iconImg.src = `https://www.hko.gov.hk/images/wxicon/pic${iconCode}.png`;
                    iconImg.style.display = 'block';
                }

                const fRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fData = await fRes.json();
                if (fData?.weatherForecast?.length > 0) {
                    const nowStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
                    let todayFc = fData.weatherForecast.find(f => f.forecastDate === nowStr) || fData.weatherForecast[0];
                    if (todayFc) {
                        document.getElementById('wx-max').textContent = todayFc.forecastMaxtemp.value + '°C';
                        document.getElementById('wx-min').textContent = todayFc.forecastMintemp.value + '°C';
                        if (todayFc.PSR) {
                            document.getElementById('wx-rain').textContent = todayFc.PSR;
                        }
                    }
                }
            } catch (e) {}
            fetchWeatherWarnings();
        }

        async function fetchWeatherWarnings() {
            const warningBox = document.getElementById('weather-warning-box');
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                if (res.ok) {
                    const data = await res.json();
                    let warningHtml = '';

                    for (const key in data) {
                        const item = data[key];
                        if (item && item.name) {
                            let customClass = '';
                            let nameText = item.name;
                            const code = item.code || '';

                            if (code === 'WRAINY' || nameText.includes('黃色暴雨')) {
                                nameText = '黃色暴雨警告';
                                customClass = 'badge-rain-yellow';
                            } else if (code === 'WRAINR' || nameText.includes('紅色暴雨')) {
                                nameText = '紅色暴雨警告';
                                customClass = 'badge-rain-red';
                            } else if (code === 'WRAINB' || nameText.includes('黑色暴雨')) {
                                nameText = '黑色暴雨警告';
                                customClass = 'badge-rain-black';
                            } else if (code.startsWith('TC') || nameText.includes('熱帶氣旋')) {
                                customClass = 'badge-typhoon';
                                if (code === 'TC1' || nameText.includes('一號')) nameText = '1號戒備訊號';
                                else if (code === 'TC3' || nameText.includes('三號')) nameText = '3號強風訊號';
                                else if (code.includes('TC8') || nameText.includes('八號')) nameText = '8號烈風/暴風訊號';
                                else if (code === 'TC9' || nameText.includes('九號')) nameText = '9號烈風/暴風增強訊號';
                                else if (code === 'TC10' || nameText.includes('十號')) nameText = '10號颶風訊號';
                            }

                            warningHtml += `<span class="warning-badge ${customClass}">⚠️ ${nameText}</span>`;
                        }
                    }

                    warningBox.innerHTML = warningHtml;
                    warningBox.style.display = warningHtml ? 'flex' : 'none';
                }
            } catch (err) { warningBox.style.display = 'none'; }
        }

        async function fetchMTR() {
            const container = document.getElementById('mtr-eta-list');
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=HEO');
                const json = await res.json();
                if (json.status === 1 && json.data) {
                    const stationData = json.data['TML-HEO'];
                    if (!stationData) {
                        container.innerHTML = '<div style="color: var(--sub-text); text-align: center; padding: 10px;">暫無列車資料</div>';
                        return;
                    }

                    const destMap = { 'WKS': '烏溪沙', 'MOS': '馬鞍山', 'TUM': '屯門', 'HUH': '紅磡', 'ETS': '尖東', 'KAT': '啟德', 'DIH': '鑽石山' };
                    
                    let allTrains = [];
                    (stationData.DOWN || []).forEach(t => allTrains.push({ ...t, defaultDest: '屯門' }));
                    (stationData.UP || []).forEach(t => allTrains.push({ ...t, defaultDest: '烏溪沙' }));
                    
                    allTrains.sort((a, b) => new Date(a.time.replace(/-/g, '/')) - new Date(b.time.replace(/-/g, '/')));
                    const top4Trains = allTrains.slice(0, 4);

                    let html = '<div class="mtr-grid-4x1">';
                    for (let i = 0; i < 4; i++) {
                        html += renderMtrCard4x1(top4Trains[i], destMap);
                    }
                    html += '</div>';
                    
                    container.innerHTML = html;
                }
            } catch (e) {}
        }

        function renderMtrCard4x1(t, destMap) {
            if (!t) {
                return `
                    <div class="mtr-card-4x1" style="opacity: 0.35; justify-content: center;">
                        <span style="font-size: 0.95rem; color: var(--sub-text);">暫無班次</span>
                    </div>
                `;
            }
            const destName = destMap[t.dest] || t.dest || t.defaultDest;
            const trainTime = new Date(t.time.replace(/-/g, '/'));
            const diffMin = Math.round((trainTime - new Date()) / 60000);
            
            const hours = String(trainTime.getHours()).padStart(2, '0');
            const mins = String(trainTime.getMinutes()).padStart(2, '0');
            const clockTime = `${hours}:${mins}`;
            
            const timeText = diffMin <= 0 ? '即到' : `${diffMin} 分`;
            const destColor = (t.dest === 'WKS' || destName === '烏溪沙') ? 'var(--accent-blue)' : 'var(--accent-purple)';

            return `
                <div class="mtr-card-4x1">
                    <span style="font-size: 1.15rem; color: ${destColor}; font-weight: 800;">往 ${destName}</span>
                    <div style="font-size: 2.1rem; color: var(--accent-green); font-weight: 900; margin: 2px 0;">${timeText}</div>
                    <span style="font-size: 1.3rem; color: var(--accent-yellow); font-weight: bold;">${clockTime}</span>
                </div>
            `;
        }

        function getStoredBusRoutes() {
            const saved = localStorage.getItem('custom_bus_routes');
            if (saved) { try { return JSON.parse(saved); } catch (e) {} }
            return [
                { route: '85K', stop: '003345', name: '錦鞍苑往沙田' },
                { route: '681', stop: '003345', name: '錦鞍苑往港島' }
            ];
        }

        async function fetchBusETA() {
            const container = document.getElementById('bus-eta-list');
            const routes = getStoredBusRoutes();
            if (routes.length === 0) {
                container.innerHTML = '<div style="color: var(--sub-text); text-align: center; padding: 10px; font-size: 1.1rem;">請新增巴士路線</div>';
                return;
            }

            let htmlContent = '';
            for (let i = 0; i < routes.length; i++) {
                let r = routes[i];
                try {
                    let etas = [];
                    for (let st = 1; st <= 2; st++) {
                        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${r.stop}/${r.route}/${st}`);
                        if (res.ok) {
                            const data = await res.json();
                            if (data && data.data) etas = etas.concat(data.data);
                        }
                    }
                    
                    let top3Etas = [];
                    if (etas && etas.length > 0) {
                        const validEtas = etas.filter(e => e.eta);
                        if (validEtas.length > 0) {
                            validEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                            const uniqueEtas = [];
                            validEtas.forEach(e => {
                                const eTime = new Date(e.eta).getTime();
                                if (!uniqueEtas.some(existing => Math.abs(eTime - new Date(existing.eta).getTime()) < 60000)) {
                                    uniqueEtas.push(e);
                                }
                            });
                            top3Etas = uniqueEtas.slice(0, 3);
                        }
                    }

                    let boxesHtml = '';
                    for (let bIdx = 0; bIdx < 3; bIdx++) {
                        const e = top3Etas[bIdx];
                        if (e) {
                            const nextTime = new Date(e.eta);
                            const diffMin = Math.round((nextTime - new Date()) / 60000);
                            const timeStr = diffMin <= 1 ? '將到' : `${diffMin} 分`;
                            const clockTime = `${String(nextTime.getHours()).padStart(2, '0')}:${String(nextTime.getMinutes()).padStart(2, '0')}`;

                            const rmkText = e.rmk_tc ? e.rmk_tc.trim() : '';
                            
                            // 特別車精準判斷邏輯
                            const specialKeywords = ['特別', '特快', '繞經', '不經', '由', '加開', '短途', '特別班次', '開出'];
                            const isRoutineText = (rmkText === '預定班次' || rmkText === '常規班次' || rmkText === '預定班次(常規)' || rmkText === '原定班次');

                            let isSpecial = (e.service_type > 1);
                            if (!isSpecial && rmkText && !isRoutineText) {
                                isSpecial = specialKeywords.some(kw => rmkText.includes(kw));
                            }

                            const showRemark = rmkText && !isRoutineText;

                            boxesHtml += `
                                <div class="bus-card-box">
                                    <div style="font-size: 2.1rem; color: var(--accent-green); font-weight: 900;">${timeStr}</div>
                                    <div style="font-size: 1.3rem; color: var(--accent-yellow); font-weight: bold; margin: 2px 0;">${clockTime}</div>
                                    <span class="status-pill ${isSpecial ? 'pill-active-special' : 'pill-active-normal'}">${isSpecial ? '特別' : '普通'}</span>
                                    ${showRemark ? `<div style="font-size: 0.75rem; color: var(--sub-text); margin-top: 2px; line-height: 1.1; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${rmkText}">${rmkText}</div>` : ''}
                                </div>
                            `;
                        } else {
                            boxesHtml += `
                                <div class="bus-card-box" style="opacity: 0.35; justify-content: center;">
                                    <span style="font-size: 0.95rem; color: var(--sub-text);">無班次</span>
                                </div>
                            `;
                        }
                    }

                    htmlContent += `
                        <div style="background: var(--box-bg); padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border-color);">
                            <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <span class="route-badge">${r.route}</span>
                                    ${r.name ? `<span style="font-size: 1.25rem; font-weight: bold; color: var(--accent-blue);">${r.name}</span>` : ''}
                                </div>
                                <button onclick="removeBusRoute(${i})" style="background:none; border:none; color:var(--accent-red); cursor:pointer; font-weight:bold; font-size: 1.3rem;">✕</button>
                            </div>
                            <div class="bus-grid-3">
                                ${boxesHtml}
                            </div>
                        </div>
                    `;
                } catch (err) {}
            }
            container.innerHTML = htmlContent;
        }

        function addBusRoute() {
            const routeInput = document.getElementById('bus-route-input');
            const stopInput = document.getElementById('bus-stop-input');
            const nameInput = document.getElementById('bus-name-input');
            
            const routeVal = routeInput.value.trim().toUpperCase();
            if (!routeVal) return;
            
            let routes = getStoredBusRoutes();
            routes.push({ route: routeVal, stop: stopInput.value.trim() || '003345', name: nameInput.value.trim() });
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            
            routeInput.value = ''; nameInput.value = '';
            fetchBusETA();
        }

        function removeBusRoute(index) {
            let routes = getStoredBusRoutes();
            routes.splice(index, 1);
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            fetchBusETA();
        }

        async function loadMemosFromCloud() {
            try {
                const res = await fetch(NPOINT_URL);
                const data = await res.json();
                if (Array.isArray(data)) {
                    renderMemos(data);
                    localStorage.setItem('cached_memos', JSON.stringify(data));
                }
            } catch (e) {
                const cached = localStorage.getItem('cached_memos');
                if (cached) renderMemos(JSON.parse(cached));
            }
        }

        async function saveMemosToCloud(memos) {
            localStorage.setItem('cached_memos', JSON.stringify(memos));
            try {
                await fetch(NPOINT_URL, {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(memos)
                });
            } catch (e) {}
        }

        function renderMemos(memos) {
            const listEl = document.getElementById('memo-list');
            if (!memos || memos.length === 0) {
                listEl.innerHTML = '<div style="color: var(--sub-text); text-align: center; padding: 6px; font-size: 1.2rem;">目前沒有備忘</div>';
                return;
            }
            listEl.innerHTML = memos.map((text, index) => `
                <div class="memo-item">
                    <span>• ${text}</span>
                    <div class="memo-actions">
                        <button class="memo-action-btn" onclick="moveMemo(${index}, -1)" ${index === 0 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬆</button>
                        <button class="memo-action-btn" onclick="moveMemo(${index}, 1)" ${index === memos.length - 1 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬇</button>
                        <button class="memo-delete" onclick="deleteMemo(${index})">✕</button>
                    </div>
                </div>
            `).join('');
            window.currentMemos = memos; 
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            if (!input.value.trim()) return;
            let memos = window.currentMemos || [];
            memos.push(input.value.trim());
            input.value = '';
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function moveMemo(index, direction) {
            let memos = window.currentMemos || [];
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= memos.length) return;
            const item = memos.splice(index, 1)[0];
            memos.splice(targetIndex, 0, item);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function deleteMemo(index) {
            let memos = window.currentMemos || [];
            memos.splice(index, 1);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        window.onload = function() {
            updateTime();
            updateHolidayCountdown();
            fetchWeather();
            loadMemosFromCloud(); 
            fetchMTR();
            fetchBusETA();
        };

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 300000); 
        setInterval(fetchMTR, 15000);
        setInterval(fetchBusETA, 20000);
        setInterval(loadMemosFromCloud, 60000);
    </script>
</body>
</html>
