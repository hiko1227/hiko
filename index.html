<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桌面資訊儀表板 (橫向版)</title>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: rgba(28, 37, 65, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 12px;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 橫向雙欄佈局 */
        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 600px;
        }

        .column {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 100%;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 左側：大時間與日期 */
        .time-card {
            flex: 2;
            text-align: center;
            background: linear-gradient(135deg, rgba(28, 37, 65, 0.9), rgba(11, 19, 43, 0.9));
        }

        #clock {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1.1;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        #date {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        #countdown {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
        }

        /* 天氣卡片 */
        .weather-card {
            flex: 1;
        }

        /* 恆指卡片 */
        .hsi-card {
            flex: 1;
        }

        .hsi-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            padding: 10px 14px;
            border-radius: 10px;
            margin-top: 6px;
        }

        #hsi-price {
            font-size: 1.6rem;
            font-weight: bold;
        }

        #hsi-change {
            font-size: 1rem;
            font-weight: bold;
        }

        .update-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 4px;
        }

        /* 備忘錄卡片 */
        .memo-card {
            flex: 2;
            justify-content: flex-start;
            overflow: hidden;
        }

        .memo-input-group {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            margin-top: 6px;
        }

        .memo-input-group input {
            flex: 1;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.25);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            -webkit-user-select: text;
            user-select: text;
        }

        .memo-input-group button {
            padding: 8px 14px;
            border-radius: 6px;
            border: none;
            background: var(--accent-blue);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        #memo-list {
            overflow-y: auto;
            max-height: 120px;
            padding-right: 4px;
        }

        .memo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .memo-delete {
            background: none;
            border: none;
            color: var(--accent-red);
            font-size: 1rem;
            cursor: pointer;
            padding: 0 4px;
        }

        /* 標題共用樣式 */
        .card-title {
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- 左欄：時間、日期、天氣 -->
        <div class="column">
            <div class="card time-card">
                <div id="clock">00:00:00</div>
                <div id="date">加載中...</div>
                <div><span id="countdown">假期倒數：計算中...</span></div>
            </div>

            <div class="card weather-card">
                <div class="card-title">香港即時天氣</div>
                <div id="weather-info" style="font-size: 1rem; margin-top: 6px;">載入天氣數據中...</div>
            </div>
        </div>

        <!-- 右欄：恆指、備忘錄 -->
        <div class="column">
            <div class="card hsi-card">
                <div class="card-title">香港恆生指數 (HSI)</div>
                <div class="hsi-body">
                    <div id="hsi-price">載入中...</div>
                    <div id="hsi-change">--</div>
                </div>
                <div id="hsi-update-time" class="update-time">更新時間: --</div>
            </div>

            <div class="card memo-card">
                <div class="card-title">桌面備忘錄</div>
                <div class="memo-input-group">
                    <input type="text" id="memo-input" placeholder="新增待辦..." onkeypress="if(event.key==='Enter') addMemo()">
                    <button onclick="addMemo()">新增</button>
                </div>
                <div id="memo-list"></div>
            </div>
        </div>
    </div>

    <script>
        const NPOINT_URL = 'https://api.npoint.io/YOUR_NPOINT_ID';

        // 1. 時鐘與日期
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('zh-HK', { hour12: false });
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('zh-HK', options);
        }

        // 2. 假期倒數
        function updateHolidayCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            
            let nextHoliday = new Date(currentYear, 9, 1); // 10月1日國慶
            if (now > nextHoliday) {
                nextHoliday = new Date(currentYear + 1, 9, 1);
            }

            const diffTime = nextHoliday - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            document.getElementById('countdown').textContent = `距離 10月1日 假期：仲有 ${diffDays} 天`;
        }

        // 3. 香港天文台天氣
        async function fetchWeather() {
            const weatherEl = document.getElementById('weather-info');
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                const temp = data.temperature.data[0].value;
                const humidity = data.humidity.data[0].value;
                const rainfall = data.rainfall.data[0]?.max || 0;

                weatherEl.innerHTML = `🌡️ 氣溫: <b>${temp}°C</b> &nbsp;|&nbsp; 💧 濕度: <b>${humidity}%</b><br><span style="font-size:0.85rem; color:#94a3b8;">🌧️ 今日降雨量: ${rainfall} mm</span>`;
            } catch (err) {
                weatherEl.textContent = '天氣數據讀取失敗';
            }
        }

        // 4. 香港恆生指數 (Yahoo Finance API)
        async function fetchHSI() {
            const priceEl = document.getElementById('hsi-price');
            const changeEl = document.getElementById('hsi-change');
            const timeEl = document.getElementById('hsi-update-time');

            try {
                const res = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/%5EHSI?interval=1m&range=1d');
                if (!res.ok) throw new Error('網絡數據讀取失敗');
                
                const data = await res.json();
                const meta = data.chart.result[0].meta;
                
                const currentPrice = meta.regularMarketPrice;
                const previousClose = meta.chartPreviousClose;
                const change = currentPrice - previousClose;
                const changePercent = (change / previousClose) * 100;
                
                const isPositive = change >= 0;
                const sign = isPositive ? '+' : '';
                const color = isPositive ? 'var(--accent-green)' : 'var(--accent-red)';

                priceEl.textContent = currentPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                priceEl.style.color = '#ffffff';

                changeEl.textContent = `${sign}${change.toFixed(2)} (${sign}${changePercent.toFixed(2)}%)`;
                changeEl.style.color = color;

                const now = new Date();
                timeEl.textContent = `更新時間: ${now.toLocaleTimeString('zh-HK', { hour12: false })}`;
            } catch (err) {
                console.error('抓取恆指失敗:', err);
                priceEl.textContent = '無法取得數據';
                changeEl.textContent = '--';
            }
        }

        // 5. 雲端備忘錄
        async function loadMemosFromCloud() {
            const memoList = document.getElementById('memo-list');
            try {
                if (NPOINT_URL.includes('YOUR_NPOINT_ID')) throw new Error('未設定 npoint');
                
                const res = await fetch(NPOINT_URL);
                if (!res.ok) throw new Error('雲端讀取失敗');
                const data = await res.json();
                
                let memos = Array.isArray(data) ? data : (data.memos || []);
                renderMemos(memos);
            } catch (err) {
                const localData = localStorage.getItem('backup_memos');
                renderMemos(localData ? JSON.parse(localData) : []);
            }
        }

        function renderMemos(memos) {
            const memoList = document.getElementById('memo-list');
            localStorage.setItem('backup_memos', JSON.stringify(memos));
            
            if (memos.length === 0) {
                memoList.innerHTML = '<div style="color: #94a3b8; text-align: center; padding: 6px; font-size: 0.85rem;">暫無待辦事項</div>';
                return;
            }

            memoList.innerHTML = memos.map((item, index) => {
                const text = typeof item === 'string' ? item : item.text;
                return `
                    <div class="memo-item">
                        <span>${text}</span>
                        <button class="memo-delete" onclick="deleteMemo(${index})" title="刪除">✕</button>
                    </div>
                `;
            }).join('');
        }

        async function saveMemosToCloud(memos) {
            renderMemos(memos);
            try {
                if (!NPOINT_URL.includes('YOUR_NPOINT_ID')) {
                    await fetch(NPOINT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ memos: memos })
                    });
                }
            } catch (err) {
                console.error('儲存至雲端失敗:', err);
            }
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            const text = input.value.trim();
            if (!text) return;

            let currentMemos = [];
            const localData = localStorage.getItem('backup_memos');
            if (localData) currentMemos = JSON.parse(localData);

            currentMemos.push({ text: text, createdAt: new Date().toISOString() });
            input.value = '';
            
            await saveMemosToCloud(currentMemos);
        }

        async function deleteMemo(index) {
            let currentMemos = [];
            const localData = localStorage.getItem('backup_memos');
            if (localData) currentMemos = JSON.parse(localData);

            currentMemos.splice(index, 1);
            await saveMemosToCloud(currentMemos);
        }

        // 初始化與定時更新
        updateTime();
        updateHolidayCountdown();
        fetchWeather();
        fetchHSI();
        loadMemosFromCloud();

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000);       // 10分鐘更新天氣
        setInterval(fetchHSI, 60000);            // 1分鐘更新恆指
        setInterval(loadMemosFromCloud, 300000); // 5分鐘同步備忘
    </script>
</body>
</html>
