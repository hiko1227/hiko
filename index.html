<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>星空個人 Dashboard</title>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: rgba(255, 255, 255, 0.06); 
            --text-main: #f3f4f6; 
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-orange: #f59e0b;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 8px; 
            margin: 0; 
            font-size: 1.15rem;
        }

        .top-header { 
            background: var(--card-bg); 
            padding: 12px 18px; 
            border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.08); 
            max-width: 1200px; 
            margin: 0 auto 8px auto; 
            display: grid; 
            grid-template-columns: 1.5fr 1.5fr 0.5fr; 
            align-items: center; 
            backdrop-filter: blur(10px);
        }
        
        .header-left { display: flex; align-items: baseline; gap: 10px; font-size: 2.2rem; font-weight: 800; }
        .date-part { color: var(--text-main); }
        .weekday-part { color: var(--accent-blue); }

        .header-center { text-align: center; display: flex; align-items: baseline; justify-content: center; gap: 6px; }
        .clock { font-size: 2.2rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }
        .ampm { font-size: 1.1rem; font-weight: 700; color: var(--accent-orange); text-transform: uppercase; }

        .header-right { display: flex; align-items: center; justify-content: flex-end; }

        .realistic-moon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #e5e7eb 0%, #9ca3af 40%, #1f2937 70%, #030712 100%);
            box-shadow: inset -8px -4px 12px rgba(0, 0, 0, 0.9), 0 0 10px rgba(192, 132, 252, 0.3);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .moon-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 50%;
            transition: transform 0.5s ease;
            transform-origin: center;
        }

        .main-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 8px; max-width: 1200px; margin: auto; }
        .panel { 
            background: var(--card-bg); 
            padding: 12px 16px; 
            border-radius: 14px; 
            border: 1px solid rgba(255,255,255,0.08); 
            backdrop-filter: blur(10px);
            margin-bottom: 8px;
        }
        .panel-title { 
            font-size: 1.2rem; color: var(--accent-green); font-weight: 700; margin-bottom: 10px; 
            border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; 
            display: flex; justify-content: space-between; align-items: center; 
        }
        
        .wx-temp-box { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
        .wx-temp { font-size: 2.8rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }
        .forecast-container { margin-top: 8px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
        .forecast-row { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: 8px; font-size: 1rem; font-weight: 600; }

        .transport-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; margin: 6px 0; border-radius: 10px; font-weight: 700; font-size: 1.1rem; background: rgba(255,255,255,0.05); }
        .mtr-up { border-left: 6px solid var(--accent-blue); }
        .mtr-down { border-left: 6px solid var(--accent-purple); }
        .bus-normal { border-left: 6px solid var(--accent-green); }
        .bus-special { border-left: 6px solid var(--accent-orange); background: rgba(245, 158, 11, 0.12); }
        
        .time-val { color: var(--accent-green); font-size: 1.05rem; font-weight: 800; text-align: right; }
        .sub-note { font-size: 0.85rem; color: #9ca3af; font-weight: normal; display: block; }
        
        .memo-input-box { display: flex; gap: 8px; margin-bottom: 8px; }
        .memo-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); padding: 8px 12px; border-radius: 8px; color: #fff; font-size: 1.15rem; outline: none; }
        .memo-btn { background: var(--accent-green); color: #0b0f19; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
        
        .memo-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
        .memo-item { background: rgba(0,0,0,0.25); padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; font-weight: 600; gap: 8px; }
        .memo-actions { display: flex; gap: 4px; }
        .memo-action-btn { background: rgba(255,255,255,0.1); color: #fff; border: none; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        .memo-action-btn:hover { background: rgba(255,255,255,0.2); }
        .memo-delete { color: #f87171; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 1rem; padding: 2px 4px; }
        
        .refresh-memo-btn { background: rgba(255, 255, 255, 0.1); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.2); padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="header-left">
            <span class="date-part" id="date-part">--</span>
            <span class="weekday-part" id="weekday-part">--</span>
        </div>

        <div class="header-center">
            <span class="clock" id="clock">00:00:00</span>
            <span class="ampm" id="ampm">--</span>
        </div>

        <div class="header-right">
            <div class="realistic-moon" title="即時月相">
                <div class="moon-shadow" id="moon-shadow"></div>
            </div>
        </div>
    </div>

    <div class="main-grid">
        <div>
            <div class="panel">
                <div class="panel-title"><span>☀️ 香港天文台 (沙田實況)</span></div>
                <div class="wx-temp-box">
                    <span class="wx-temp" id="current-temp">--°C</span>
                    <span style="font-size: 2.2rem;">⛅</span>
                </div>
                <div style="margin-top: 4px; font-size: 1rem;">狀況: <span id="current-desc" style="color:var(--accent-blue); font-weight:700;">連線中...</span></div>
                
                <div class="forecast-container">
                    <div style="font-size: 0.95rem; color: var(--accent-green); font-weight: 700;">🔮 天文台明日預報</div>
                    <div class="forecast-row"><span id="fc-date-1">--</span><span id="fc-wx-1">讀取中...</span></div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">
                    <span>📝 雲端備忘錄</span>
                    <button class="refresh-memo-btn" onclick="loadMemosFromCloud()">🔄 同步</button>
                </div>

                <div class="memo-input-box">
                    <input type="text" id="memo-input" class="memo-input" placeholder="輸入備忘..." onkeypress="if(event.key==='Enter')addMemo()">
                    <button class="memo-btn" onclick="addMemo()">新增</button>
                </div>

                <div class="memo-list" id="memo-list">
                    <div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1rem;">正在連接雲端...</div>
                </div>
            </div>
        </div>

        <div>
            <div class="panel">
                <div class="panel-title">🚇 港鐵恆安站 (屯馬線)</div>
                
                <div class="transport-row mtr-up">
                    <div>往 烏溪沙<span class="sub-note">港鐵官方實時</span></div>
                    <span class="time-val" id="mtr-up">連線中...</span>
                </div>
                
                <div class="transport-row mtr-down">
                    <div>往 屯門<span class="sub-note">港鐵官方實時</span></div>
                    <span class="time-val" id="mtr-down">連線中...</span>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">🚌 官方實時巴士 (89C)</div>
                
                <div class="transport-row bus-special">
                    <div>🔥 欣安邨 - 89C [特別班次]<span class="sub-note">往觀塘 (九巴官方API)</span></div>
                    <span class="time-val" style="color: var(--accent-orange);" id="hin-special">連線中...</span>
                </div>

                <div class="transport-row bus-special" style="border-left-color: #f97316; background: rgba(249, 115, 22, 0.08);">
                    <div>🔥 錦鞍苑 - 89C [特別班次]<span class="sub-note">往觀塘 (九巴官方API)</span></div>
                    <span class="time-val" style="color: var(--accent-orange);" id="k-special">連線中...</span>
                </div>

                <div class="transport-row bus-normal">
                    <div>錦鞍苑 - 89C<span class="sub-note">往觀塘 (普通班次)</span></div>
                    <span class="time-val" id="k-89c">連線中...</span>
                </div>

                <div class="transport-row bus-normal" style="border-left-color: #38bdf8;">
                    <div>欣安邨 - 89C<span class="sub-note">往觀塘 (普通班次)</span></div>
                    <span class="time-val" id="hin-89c">連線中...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.14/lunar.js"></script>

    <script>
        const BIN_ID = "6a87123ada38895dfefbc1ca"; 
        const MASTER_KEY = "$2a$10$HvcOoQBCbmfplG2XSkexuOAFTbJfJzpuucJSOImKmhiM3K//7f5kO";

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${hoursStr}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;

            document.getElementById('date-part').textContent = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric'});
            document.getElementById('weekday-part').textContent = now.toLocaleDateString('zh-HK', {weekday:'long'});

            try {
                const solar = Solar.fromDate(now);
                const lunar = solar.getLunar();
                const lunarDay = lunar.getDay();
                let shadowTransform = 'translateX(0%)';

                if (lunarDay === 1) shadowTransform = 'translateX(0%)';
                else if (lunarDay > 1 && lunarDay < 7) shadowTransform = 'translateX(35%)';
                else if (lunarDay === 7 || lunarDay === 8) shadowTransform = 'translateX(50%)';
                else if (lunarDay > 8 && lunarDay < 15) shadowTransform = 'translateX(75%)';
                else if (lunarDay === 15 || lunarDay === 16) shadowTransform = 'translateX(100%)';
                else if (lunarDay > 16 && lunarDay < 22) shadowTransform = 'translateX(-75%)';
                else if (lunarDay === 22 || lunarDay === 23) shadowTransform = 'translateX(-50%)';
                else shadowTransform = 'translateX(-35%)';

                document.getElementById('moon-shadow').style.transform = shadowTransform;
            } catch (e) {}
        }

        async function fetchMTR() {
            try {
                const targetUrl = 'https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=MOS&sta=HET';
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
                const wrapper = await res.json();
                const data = JSON.parse(wrapper.contents);

                if (data && data.status === 1 && data.data && data.data['HET']) {
                    const hetData = data.data['HET'];
                    parseMTRDirection(hetData.UP, 'mtr-up');
                    parseMTRDirection(hetData.DOWN, 'mtr-down');
                } else {
                    document.getElementById('mtr-up').textContent = '暫無資料';
                    document.getElementById('mtr-down').textContent = '暫無資料';
                }
            } catch (e) {
                document.getElementById('mtr-up').textContent = '暫時無法連接';
                document.getElementById('mtr-down').textContent = '暫時無法連接';
            }
        }

        function parseMTRDirection(directionObj, elementId) {
            if (!directionObj || !directionObj.trains || directionObj.trains.length === 0) {
                document.getElementById(elementId).textContent = '暫無班次';
                return;
            }

            let times = [];
            directionObj.trains.forEach(train => {
                if (train.time) {
                    let arrivalTime = new Date(train.time.replace(/-/g, '/'));
                    let now = new Date();
                    let diffMin = Math.round((arrivalTime - now) / 60000);
                    
                    let hh = String(arrivalTime.getHours()).padStart(2, '0');
                    let mm = String(arrivalTime.getMinutes()).padStart(2, '0');
                    let timeFormatted = `${hh}:${mm}`;

                    if (diffMin <= 0) {
                        times.push(`將至 (${timeFormatted})`);
                    } else {
                        times.push(`${diffMin}分鐘 (${timeFormatted})`);
                    }
                }
            });

            document.getElementById(elementId).textContent = times.length > 0 ? times.slice(0, 2).join(' | ') : '--';
        }

        async function fetchWeather() {
            try {
                const tempRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const tempData = await tempRes.json();
                if (tempData && tempData.temperature && tempData.temperature.data) {
                    const shatin = tempData.temperature.data.find(item => item.place === "沙田");
                    if (shatin) {
                        document.getElementById('current-temp').textContent = shatin.value + '°C';
                    }
                }

                const forecastRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const forecastData = await forecastRes.json();
                if (forecastData && forecastData.weatherForecast && forecastData.weatherForecast.length > 0) {
                    let f = forecastData.weatherForecast[0];
                    let fDateStr = f.forecastDate;
                    let month = parseInt(fDateStr.substring(4, 6));
                    let day = parseInt(fDateStr.substring(6, 8));
                    
                    document.getElementById('fc-date-1').textContent = `${month}月${day}日`;
                    document.getElementById('fc-wx-1').textContent = `${f.forecastWeather} (${f.forecastMintemp.value}°C - ${f.forecastMaxtemp.value}°C)`;
                    document.getElementById('current-desc').textContent = forecastData.generalSituation || '香港天文台實況正常';
                }
            } catch (e) {
                document.getElementById('current-temp').textContent = '--°C';
                document.getElementById('current-desc').textContent = '天文台 API 未能連線';
            }
        }

        async function fetchBusETA() {
            try {
                const targetUrl = 'https://data.etabus.gov.hk/v1/transport/kmb/eta/route/89C';
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
                const wrapper = await res.json();
                const data = JSON.parse(wrapper.contents);

                if (data && data.data) {
                    const etas = data.data;
                    let kamOnEtas = etas.filter(e => e.stop === "MA321" && e.dir === "O");
                    let yanOnEtas = etas.filter(e => e.stop === "MA140" && e.dir === "O");

                    formatAndDisplayETA(kamOnEtas, 'k-89c', 'k-special');
                    formatAndDisplayETA(yanOnEtas, 'hin-89c', 'hin-special');
                }
            } catch (e) {
                document.getElementById('k-89c').textContent = '暫時無法連接';
                document.getElementById('hin-89c').textContent = '暫時無法連接';
            }
        }

        function formatAndDisplayETA(stationEtas, normalId, specialId) {
            if (!stationEtas || stationEtas.length === 0) {
                document.getElementById(normalId).textContent = '暫無班次';
                document.getElementById(specialId).textContent = '非服務時間';
                return;
            }

            let normalList = [];
            let specialList = [];

            stationEtas.forEach(eta => {
                let timeStr = formatArrivalTime(eta.eta);
                if (timeStr) {
                    if (eta.rmk_tc && (eta.rmk_tc.includes('特別') || eta.rmk_tc.includes('特快'))) {
                        specialList.push(timeStr);
                    } else {
                        normalList.push(timeStr);
                    }
                }
            });

            document.getElementById(normalId).textContent = normalList.length > 0 ? normalList.join(', ') : '--';
            document.getElementById(specialId).textContent = specialList.length > 0 ? specialList.join(', ') : '非服務時間';
        }

        function formatArrivalTime(etaString) {
            if (!etaString) return null;
            const arrival = new Date(etaString);
            const now = new Date();
            const diffMin = Math.round((arrival - now) / 60000);
            if (diffMin <= 0) return '將至';
            return `${diffMin}分鐘`;
        }

        async function loadMemosFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { "X-Master-Key": MASTER_KEY }
                });
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();
                const memos = data.record;
                if (Array.isArray(memos)) {
                    renderMemos(memos);
                    localStorage.setItem('cached_memos', JSON.stringify(memos));
                }
            } catch (e) {
                const cached = localStorage.getItem('cached_memos');
                if (cached) renderMemos(JSON.parse(cached));
            }
        }

        async function saveMemosToCloud(memos) {
            localStorage.setItem('cached_memos', JSON.stringify(memos));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { 
                        "Content-Type": "application/json",
                        "X-Master-Key": MASTER_KEY 
                    },
                    body: JSON.stringify(memos)
                });
            } catch (e) {}
        }

        function renderMemos(memos) {
            const listEl = document.getElementById('memo-list');
            if (memos.length === 0) {
                listEl.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 6px; font-size: 1rem;">目前沒有備忘</div>';
                return;
            }
            listEl.innerHTML = memos.map((text, index) => `
                <div class="memo-item">
                    <span>• ${text}</span>
                    <div class="memo-actions">
                        <button class="memo-action-btn" onclick="moveMemo(${index}, -1)" ${index === 0 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬆</button>
                        <button class="memo-action-btn" onclick="moveMemo(${index}, 1)" ${index === memos.length - 1 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬇</button>
                        <button class="memo-delete" onclick="deleteMemo(${index})">✕</button>
                    </div>
                </div>
            `).join('');
            window.currentMemos = memos; 
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            const val = input.value.trim();
            if (!val) return;

            let memos = window.currentMemos || [];
            memos.push(val);
            input.value = '';
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function moveMemo(index, direction) {
            let memos = window.currentMemos || [];
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= memos.length) return;
            
            + memos.splice(index, 1)[0];
            const item = memos.splice(index, 1)[0]; // 確保安全調轉
            memos.splice(targetIndex, 0, item);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function deleteMemo(index) {
            let memos = window.currentMemos || [];
            memos.splice(index, 1);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000); 
        setInterval(fetchBusETA, 30000); 
        setInterval(fetchMTR, 30000); 
        setInterval(loadMemosFromCloud, 30000); 

        updateTime(); 
        fetchWeather();
        fetchBusETA();
        fetchMTR();
        loadMemosFromCloud(); 
    </script>
</body>
</html>
