<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>星空個人 Dashboard</title>
    <style>
        :root { --bg: #0b0f19; --card: #1a1f2e; --text: #ffffff; --accent: #60a5fa; --green: #34d399; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 10px; margin: 0; font-size: 1.25rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 1400px; margin: auto; }
        .panel { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid #333; }
        .title { font-size: 1.6rem; color: var(--green); font-weight: bold; margin-bottom: 15px; }
        
        /* 交通面板強化 */
        .trans-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .trans-header { display: flex; justify-content: space-between; align-items: baseline; }
        .main-eta { font-size: 2.2rem; font-weight: 800; color: var(--green); }
        .sub-etas { font-size: 1.1rem; color: #aaa; margin-top: 5px; border-top: 1px solid #333; padding-top: 5px; }
        
        .clock { font-size: 4rem; font-weight: 900; color: var(--accent); text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="clock" id="clock">00:00:00</div>

    <div class="grid">
        <!-- 左邊：氣象 -->
        <div class="panel">
            <div class="title">☀️ 沙田區氣象</div>
            <div style="font-size: 3rem; font-weight: bold;" id="current-temp">--°C</div>
            <div style="font-size: 1.5rem;">實況: <span id="current-desc">連線中...</span></div>
        </div>

        <!-- 右邊：交通 -->
        <div class="panel">
            <div class="title">🚇 港鐵 / 🚌 巴士 (即時顯示)</div>
            
            <div class="trans-card">
                <div class="trans-header">
                    <span>屯馬線 - 往屯門</span>
                    <span class="main-eta" id="mtr-down">--</span>
                </div>
                <div class="sub-etas" id="mtr-sub">後續: --</div>
            </div>

            <div class="trans-card">
                <div class="trans-header">
                    <span>89C - 錦鞍苑往觀塘</span>
                    <span class="main-eta" id="k-89c">--</span>
                </div>
                <div class="sub-etas" id="k-89c-sub">後續: --</div>
            </div>
        </div>
    </div>

    <script>
        // 模擬數據渲染 (連接 API 後會自動更新)
        function updateDisplay() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-HK');
            // 這裡模擬兩班後續時間顯示效果
            document.getElementById('mtr-sub').textContent = "後續班次: 8分鐘 (11:15), 15分鐘 (11:22)";
            document.getElementById('k-89c-sub').textContent = "後續班次: 35分鐘 (11:35), 45分鐘 (11:45)";
        }
        setInterval(updateDisplay, 1000);
        updateDisplay();
    </script>
</body>
</html>
