<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資訊儀表板</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* 時間與倒數卡片 */
        .time-box {
            text-align: center;
        }
        #clock {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 2px;
        }
        #date {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        #countdown {
            margin-top: 12px;
            font-size: 0.95rem;
            color: #f59e0b;
        }

        /* 恆指卡片 */
        .hsi-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .hsi-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 12px;
        }
        #hsi-price {
            font-size: 1.8rem;
            font-weight: bold;
        }
        #hsi-change {
            font-size: 1.1rem;
            font-weight: bold;
        }
        .update-time {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 8px;
        }

        /* 雲端備忘錄 */
        .memo-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .memo-input-group input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        .memo-input-group button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background: var(--accent-blue);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
        .memo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .memo-delete {
            background: none;
            border: none;
            color: var(--accent-red);
            font-size: 1.1rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 時間與假期倒數 -->
        <div class="card time-box">
            <div id="clock">00:00:00</div>
            <div id="date">加載中...</div>
            <div id="countdown">假期倒數：計算中...</div>
        </div>

        <!-- 天氣資訊 -->
        <div class="card">
            <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 8px;">香港即時天氣</div>
            <div id="weather-info" style="font-size: 1.1rem;">載入天氣數據中...</div>
        </div>

        <!-- 香港恆生指數卡片 -->
        <div class="card">
            <div class="hsi-header">香港恆生指數 (HSI)</div>
            <div class="hsi-body">
                <div id="hsi-price">載入中...</div>
                <div id="hsi-change">--</div>
            </div>
            <div id="hsi-update-time" class="update-time">更新時間: --</div>
        </div>

        <!-- 雲端備忘錄 -->
        <div class="card">
            <div style="font-size: 1.2rem; font-weight: bold; margin-bottom: 12px;">備忘錄</div>
            <div class="memo-input-group">
                <input type="text" id="memo-input" placeholder="新增事項..." onkeypress="if(event.key==='Enter') addMemo()">
                <button onclick="addMemo()">新增</button>
            </div>
            <div id="memo-list"></div>
        </div>
    </div>

    <script>
        // 設定你的 npoint.io URL (如果有的話)
        const NPOINT_URL = 'https://api.npoint.io/YOUR_NPOINT_ID';

        // 1. 時鐘與日期
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('zh-HK', { hour12: false });
            
            const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
            document.getElementById('date').textContent = now.toLocaleDateString('zh-HK', options);
        }

        // 2. 假期倒數範例 (可自行更換日期與名稱)
        function updateHolidayCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            
            // 預設倒數：國慶日 (10月1日)
            let nextHoliday = new Date(currentYear, 9, 1); 
            if (now > nextHoliday) {
                nextHoliday = new Date(currentYear + 1, 9, 1);
            }

            const diffTime = nextHoliday - now;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            document.getElementById('countdown').textContent = `距離下一個主要假期 (10月1日)：仲有 ${diffDays} 天`;
        }

        // 3. 抓取天文台天氣 API
        async function fetchWeather() {
            const weatherEl = document.getElementById('weather-info');
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const data = await res.json();
                
                const temp = data.temperature.data[0].value;
                const humidity = data.humidity.data[0].value;
                const rainfall = data.rainfall.data[0]?.max || 0;

                weatherEl.innerHTML = `🌡️ 氣溫: ${temp}°C &nbsp;|&nbsp; 💧 濕度: ${humidity}% <br><span style="font-size:0.9rem; color:#94a3b8;">🌧️ 雨量: ${rainfall} mm</span>`;
            } catch (err) {
                weatherEl.textContent = '天氣數據讀取失敗';
            }
        }

        // 4. 抓取香港恆生指數數據 (使用 Yahoo Finance API)
        async function fetchHSI() {
            const priceEl = document.getElementById('hsi-price');
            const changeEl = document.getElementById('hsi-change');
            const timeEl = document.getElementById('hsi-update-time');

            try {
                const res = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/%5EHSI?interval=1m&range=1d');
                if (!res.ok) throw new Error('網絡數據讀取失敗');
                
                const data = await res.json();
                const meta = data.chart.result[0].meta;
                
                const currentPrice = meta.regularMarketPrice;
                const previousClose = meta.chartPreviousClose;
                const change = currentPrice - previousClose;
                const changePercent = (change / previousClose) * 100;
                
                const isPositive = change >= 0;
                const sign = isPositive ? '+' : '';
                const color = isPositive ? 'var(--accent-green)' : 'var(--accent-red)';

                priceEl.textContent = currentPrice.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                priceEl.style.color = '#ffffff';

                changeEl.textContent = `${sign}${change.toFixed(2)} (${sign}${changePercent.toFixed(2)}%)`;
                changeEl.style.color = color;

                const now = new Date();
                timeEl.textContent = `更新時間: ${now.toLocaleTimeString('zh-HK', { hour12: false })}`;
            } catch (err) {
                console.error('抓取恆指失敗:', err);
                priceEl.textContent = '無法取得數據';
                changeEl.textContent = '--';
            }
        }

        // 5. 雲端備忘錄邏輯
        async function loadMemosFromCloud() {
            const memoList = document.getElementById('memo-list');
            try {
                if (NPOINT_URL.includes('YOUR_NPOINT_ID')) throw new Error('未設定 npoint');
                
                const res = await fetch(NPOINT_URL);
                if (!res.ok) throw new Error('雲端讀取失敗');
                const data = await res.json();
                
                let memos = Array.isArray(data) ? data : (data.memos || []);
                renderMemos(memos);
            } catch (err) {
                const localData = localStorage.getItem('backup_memos');
                renderMemos(localData ? JSON.parse(localData) : []);
            }
        }

        function renderMemos(memos) {
            const memoList = document.getElementById('memo-list');
            localStorage.setItem('backup_memos', JSON.stringify(memos));
            
            if (memos.length === 0) {
                memoList.innerHTML = '<div style="color: #94a3b8; text-align: center; padding: 6px;">暫無備忘事項</div>';
                return;
            }

            memoList.innerHTML = memos.map((item, index) => {
                const text = typeof item === 'string' ? item : item.text;
                return `
                    <div class="memo-item">
                        <span>${text}</span>
                        <button class="memo-delete" onclick="deleteMemo(${index})" title="刪除">✕</button>
                    </div>
                `;
            }).join('');
        }

        async function saveMemosToCloud(memos) {
            renderMemos(memos);
            try {
                if (!NPOINT_URL.includes('YOUR_NPOINT_ID')) {
                    await fetch(NPOINT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ memos: memos })
                    });
                }
            } catch (err) {
                console.error('儲存至雲端失敗:', err);
            }
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            const text = input.value.trim();
            if (!text) return;

            let currentMemos = [];
            const localData = localStorage.getItem('backup_memos');
            if (localData) currentMemos = JSON.parse(localData);

            currentMemos.push({ text: text, createdAt: new Date().toISOString() });
            input.value = '';
            
            await saveMemosToCloud(currentMemos);
        }

        async function deleteMemo(index) {
            let currentMemos = [];
            const localData = localStorage.getItem('backup_memos');
            if (localData) currentMemos = JSON.parse(localData);

            currentMemos.splice(index, 1);
            await saveMemosToCloud(currentMemos);
        }

        // 初始化執行與定時刷新
        updateTime();
        updateHolidayCountdown();
        fetchWeather();
        fetchHSI();
        loadMemosFromCloud();

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000);       // 10分鐘更新天氣
        setInterval(fetchHSI, 60000);            // 1分鐘更新恆指
        setInterval(loadMemosFromCloud, 300000); // 5分鐘同步備忘
    </script>
</body>
</html>
