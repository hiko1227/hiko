<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>星空 Dashboard</title>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: rgba(255, 255, 255, 0.06); --text-main: #f3f4f6; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; padding: 20px; margin: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: auto; }
        .panel { background: var(--card-bg); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); }
        .title { font-size: 1.2rem; color: #34d399; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; }
        .val { font-size: 1.5rem; color: #fbbf24; font-weight: bold; margin-top: 5px; }
        .clock { font-size: 2.5rem; color: #60a5fa; font-weight: bold; text-align: center; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="clock" id="clock">00:00:00</div>

    <div class="grid">
        <!-- 天氣與農曆面板 -->
        <div class="panel">
            <div class="title">📅 日期與沙田天氣</div>
            <div>農曆：</div>
            <div class="val" id="lunar-date">聯網獲取中...</div>
            <br>
            <div>沙田實況氣温：</div>
            <div class="val" id="weather-val">聯網獲取中...</div>
        </div>

        <!-- 巴士到站面板 -->
        <div class="panel">
            <div class="title">🚌 錦鞍苑 89C 實況</div>
            <div>往觀塘方向：</div>
            <div class="val" id="bus-eta">實時連線中...</div>
        </div>
    </div>

    <script>
        // 時鐘
        setInterval(() => {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-HK');
        }, 1000);

        // 使用代理安全獲取網上資料
        async function fetchWithProxy(url) {
            try {
                const proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(url);
                const response = await fetch(proxy);
                const data = await response.json();
                return JSON.parse(data.contents);
            } catch (e) {
                return null;
            }
        }

        async function loadLiveData() {
            // 1. 取得今日農曆
            const today = new Date().toISOString().split('T')[0];
            const lunarData = await fetchWithProxy(`https://data.weather.gov.hk/weatherAPI/opendata/lunardate.php?date=${today}`);
            if (lunarData && lunarData.lunarDate) {
                document.getElementById('lunar-date').textContent = "農曆 " + lunarData.lunarDate;
            } else {
                document.getElementById('lunar-date').textContent = "暫時未能讀取";
            }

            // 2. 取得沙田天氣
            const weatherData = await fetchWithProxy('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrh&lang=tc');
            if (weatherData && weatherData.temperature) {
                const shatin = weatherData.temperature.data.find(i => i.place === '沙田');
                document.getElementById('weather-val').textContent = shatin ? shatin.value + ' °C' : "沙田站資料更新中";
            } else {
                document.getElementById('weather-val').textContent = "暫時未能讀取";
            }

            // 3. 取得九巴 89C 到站資料
            try {
                const busRes = await fetch('https://data.etabus.gov.hk/v1/transport/kmb/route-eta/89C/1');
                const busData = await busRes.json();
                if (busData && busData.data) {
                    const kamOn = busData.data.find(item => item.dir === 'I' && item.eta);
                    if (kamOn && kamOn.eta) {
                        const diff = Math.round((new Date(kamOn.eta) - new Date()) / 60000);
                        document.getElementById('bus-eta').textContent = diff <= 0 ? '即將到站' : `${diff} 分鐘`;
                    } else {
                        document.getElementById('bus-eta').textContent = '暫無即時班次';
                    }
                }
            } catch (e) {
                document.getElementById('bus-eta').textContent = '連線中...';
            }
        }

        loadLiveData();
        setInterval(loadLiveData, 60000); // 每分鐘自動更新一次
    </script>
</body>
</html>
