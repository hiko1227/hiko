<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>3008 Tablet Dashboard</title>
    <!-- 使用穩定的 CDN 引入農曆計算庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lunar-javascript/1.6.12/lunar.min.js"></script>
    <style>
        :root { 
            --bg-color: #0b0f19; 
            --card-bg: rgba(255, 255, 255, 0.045); 
            --text-main: #f3f4f6; 
            --accent-blue: #60a5fa;
            --accent-green: #34d399;
            --accent-yellow: #fbbf24;
            --accent-purple: #c084fc;
            --accent-orange: #f59e0b;
            --accent-red: #f87171;
        }

        body.light-mode {
            --bg-color: #f0f2f5;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1f2937;
            --accent-blue: #2563eb;
            --accent-green: #059669;
            --accent-yellow: #d97706;
            --accent-purple: #7c3aed;
            --accent-orange: #d97706;
            --accent-red: #dc2626;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 8px; 
            margin: 0; 
            font-size: 1rem; 
            transition: background-color 0.5s ease, color 0.5s ease;
            -webkit-font-smoothing: antialiased;
        }

        .main-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            max-width: 1200px; 
            margin: auto; 
        }
        
        .panel { 
            background: var(--card-bg); 
            padding: 10px 14px; 
            border-radius: 12px; 
            border: 1px solid rgba(52, 211, 153, 0.2); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            padding: 3px 7px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.2s;
        }
        .theme-toggle-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .clock { font-size: 2.2rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; text-shadow: 0 0 16px rgba(251,191,36,0.3); }
        .ampm { font-size: 0.85rem; font-weight: 700; color: var(--accent-orange); text-transform: uppercase; }

        .wx-box { display: flex; align-items: center; justify-content: space-between; }
        .wx-temp { font-size: 2.2rem; font-weight: 800; color: var(--accent-yellow); line-height: 1; }

        @keyframes warningBlink {
            0% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px rgba(248, 113, 113, 0.4); }
            50% { opacity: 0.5; transform: scale(0.98); box-shadow: 0 0 2px rgba(248, 113, 113, 0.1); }
            100% { opacity: 1; transform: scale(1); box-shadow: 0 0 8px rgba(248, 113, 113, 0.4); }
        }
        .warning-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
        .warning-badge {
            background: rgba(248, 113, 113, 0.2);
            color: var(--accent-red);
            border: 1px solid rgba(248, 113, 113, 0.5);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            animation: warningBlink 1.5s infinite ease-in-out;
        }

        .memo-input-box { display: flex; gap: 6px; margin-bottom: 6px; }
        .memo-input { flex: 1; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15); padding: 5px 8px; border-radius: 8px; color: var(--text-main); font-size: 0.9rem; outline: none; }
        .memo-input:focus { border-color: var(--accent-green); box-shadow: 0 0 8px rgba(52,211,153,0.2); }
        .memo-btn { background: var(--accent-green); color: #0b0f19; border: none; padding: 0 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; }
        
        .memo-list { display: flex; flex-direction: column; gap: 4px; max-height: 110px; overflow-y: auto; }
        .memo-item { background: rgba(0,0,0,0.25); padding: 5px 8px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: 600; gap: 6px; border: 1px solid rgba(255,255,255,0.06); }

        .memo-actions { display: flex; gap: 4px; }
        .memo-action-btn { background: rgba(255,255,255,0.1); color: var(--text-main); border: none; padding: 2px 5px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
        .memo-delete { color: var(--accent-red); background: none; border: none; font-weight: bold; cursor: pointer; font-size: 0.9rem; padding: 0 2px; }
        
        .refresh-memo-btn { background: rgba(255, 255, 255, 0.08); color: var(--text-main); border: 1px solid rgba(255, 255, 255, 0.15); padding: 2px 8px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }

        .transit-container { display: flex; flex-direction: column; gap: 6px; }

        /* 港鐵 4 個正方格網格樣式 */
        .mtr-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .mtr-square-card {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(251, 191, 36, 0.25);
            border-radius: 10px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            min-height: 72px;
        }

        .transit-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(251, 191, 36, 0.25);
            border-radius: 10px;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .route-badge { font-size: 0.9rem; font-weight: 800; color: var(--accent-yellow); background: rgba(251, 191, 36, 0.15); padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(251, 191, 36, 0.35); }
        .transit-input-box { display: flex; gap: 6px; margin-bottom: 6px; }
        .transit-input { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.15); padding: 5px 8px; border-radius: 8px; color: var(--text-main); font-size: 0.9rem; outline: none; }
        .transit-add-btn { background: var(--accent-blue); color: #0b0f19; border: none; padding: 0 10px; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; white-space: nowrap; }

        .status-pill { font-size: 0.7rem; padding: 1px 5px; border-radius: 4px; font-weight: bold; border: 1px solid rgba(255, 255, 255, 0.15); }
        .pill-active-special { background: rgba(251, 191, 36, 0.25); color: var(--accent-yellow); border-color: rgba(251, 191, 36, 0.5); }
        .pill-active-normal { background: rgba(52, 211, 153, 0.2); color: var(--accent-green); border-color: rgba(52, 211, 153, 0.4); }
        .pill-dim { background: rgba(255, 255, 255, 0.03); color: #6b7280; opacity: 0.35; }

        @media (max-width: 850px) {
            .main-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="main-grid">
        <!-- 左上：重新排版的日期、農曆、大時鐘與假期倒數 -->
        <div class="panel">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div style="display: flex; align-items: baseline; gap: 8px;">
                    <span class="date-part" id="date-part" style="font-size: 1.05rem; font-weight: 800;">--</span>
                    <span class="weekday-part" id="weekday-part" style="font-size: 1.05rem; font-weight: 800; color: var(--accent-blue);">--</span>
                </div>
                <button class="theme-toggle-btn" onclick="toggleTheme()" title="切換 Light / Dark 模式">🌓</button>
            </div>

            <!-- 農曆與節氣資訊列 -->
            <div id="lunar-info" style="font-size: 0.9rem; color: var(--accent-purple); font-weight: bold; text-align: center; background: rgba(192,132,252,0.1); padding: 4px 6px; border-radius: 6px; border: 1px solid rgba(192,132,252,0.2);">
                載入農曆中...
            </div>
            
            <div style="text-align: center; margin: 4px 0;">
                <div style="display: flex; align-items: baseline; justify-content: center; gap: 8px;">
                    <span class="clock" id="clock">00:00:00</span>
                    <span class="ampm" id="ampm">--</span>
                </div>
            </div>

            <div id="holiday-countdown" style="background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                <span style="font-size: 0.8rem; color: #9ca3af;">計算假期中...</span>
            </div>
        </div>

        <!-- 右上：重新排版的天氣資訊與警告 -->
        <div class="panel">
            <div class="wx-box">
                <div style="display: flex; align-items: center; gap: 12px;">
                    <img id="wx-icon-img" src="" alt="天氣圖示" style="width: 48px; height: 48px; display: none;" onerror="this.style.display='none'">
                    <div>
                        <div style="display: flex; align-items: baseline; gap: 8px;">
                            <span class="wx-temp" id="current-temp">--°C</span>
                        </div>
                        <div style="font-size: 0.85rem; font-weight: bold; margin-top: 3px; display: flex; gap: 6px; align-items: center;">
                            <span style="color: var(--accent-blue);">濕度: <span id="current-humidity">--%</span></span>
                            <span style="color: rgba(255,255,255,0.3);">|</span>
                            <span style="color: var(--accent-green);">降雨概率: <span id="wx-rain">--</span></span>
                        </div>
                    </div>
                </div>
                <div style="text-align: right; font-size: 0.9rem; font-weight: bold; background: rgba(0,0,0,0.2); padding: 6px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);">
                    <div style="color: var(--accent-orange);">最高: <span id="wx-max">--°C</span></div>
                    <div style="color: var(--accent-blue); margin-top: 2px;">最低: <span id="wx-min">--°C</span></div>
                </div>
            </div>
            <div id="weather-warning-box" class="warning-container" style="display: none;"></div>
            <div style="font-size: 0.75rem; color: #9ca3af; text-align: right; margin-top: auto;">香港天文台數據</div>
        </div>

        <!-- 左下：港鐵恆安站（4 個正方格網格版） + 雲端備忘錄 -->
        <div class="panel">
            <div class="transit-container" id="mtr-eta-list">
                <div style="color: #9ca3af; text-align: center; padding: 10px; font-size: 0.9rem;">載入港鐵實時資料中...</div>
            </div>

            <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; margin-top: 2px;">
                <div style="display: flex; justify-content: flex-end; margin-bottom: 4px;">
                    <button class="refresh-memo-btn" onclick="loadMemosFromCloud()">🔄 同步</button>
                </div>
                <div class="memo-input-box">
                    <input type="text" id="memo-input" class="memo-input" placeholder="輸入備忘..." onkeypress="if(event.key==='Enter')addMemo()">
                    <button class="memo-btn" onclick="addMemo()">新增</button>
                </div>
                <div class="memo-list" id="memo-list">
                    <div style="color: #9ca3af; text-align: center; padding: 4px; font-size: 0.85rem;">正在連接雲端...</div>
                </div>
            </div>
        </div>

        <!-- 右下：九巴實時到站 -->
        <div class="panel">
            <div class="transit-input-box">
                <input type="text" id="bus-route-input" class="transit-input" style="width: 50px; text-align: center;" placeholder="路線">
                <input type="text" id="bus-stop-input" class="transit-input" style="width: 70px; text-align: center;" placeholder="站ID" value="003345">
                <input type="text" id="bus-name-input" class="transit-input" style="flex: 1;" placeholder="自訂名稱">
                <button class="transit-add-btn" onclick="addBusRoute()">新增</button>
            </div>
            <div class="transit-container" id="bus-eta-list" style="max-height: 220px; overflow-y: auto;">
                <div style="color: #9ca3af; text-align: center; padding: 10px; font-size: 0.9rem;">載入巴士資料中...</div>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = "6a87123ada38895dfefbc1ca"; 
        const MASTER_KEY = "$2a$10$HvcOoQBCbmfplG2XSkexuOAFTbJfJzpuucJSOImKmhiM3K//7f5kO";

        const hkHolidays = [
            { name: "中秋節翌日", date: "2026-09-28" },
            { name: "國慶日", date: "2026-10-01" },
            { name: "重陽節", date: "2026-10-23" },
            { name: "聖誕節", date: "2026-12-25" },
            { name: "聖誕節後第一個周日", date: "2026-12-26" },
            { name: "元旦", date: "2027-01-01" },
            { name: "農曆年初一", date: "2027-02-06" },
            { name: "農曆年初二", date: "2027-02-07" },
            { name: "農曆年初三", date: "2027-02-08" },
            { name: "清明節", date: "2027-04-05" }
        ];

        function toggleTheme() {
            const body = document.body;
            if (body.classList.contains('light-mode')) {
                body.classList.remove('light-mode');
                localStorage.setItem('theme_mode', 'dark');
            } else {
                body.classList.add('light-mode');
                localStorage.setItem('theme_mode', 'light');
            }
        }

        const savedTheme = localStorage.getItem('theme_mode');
        if (savedTheme === 'light') document.body.classList.add('light-mode');

        function updateTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12; hours = hours ? hours : 12;
            const hoursStr = String(hours).padStart(2, '0');

            document.getElementById('clock').textContent = `${hoursStr}:${minutes}:${seconds}`;
            document.getElementById('ampm').textContent = ampm;
            document.getElementById('date-part').textContent = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric'});
            document.getElementById('weekday-part').textContent = now.toLocaleDateString('zh-HK', {weekday:'long'});

            // 計算農曆與節氣
            try {
                if (typeof Solar !== 'undefined') {
                    const solar = Solar.fromDate(now);
                    const lunar = solar.getLunar();
                    const gzYear = lunar.getYearInGanZhi();
                    const shengXiao = lunar.getYearShengXiao();
                    const lunarMonth = lunar.getMonthInChinese();
                    const lunarDay = lunar.getDayInChinese();
                    
                    let jieQi = lunar.getJieQi();
                    if (!jieQi) {
                        const prevJieQi = lunar.getPrevJieQi(true); 
                        if (prevJieQi) jieQi = prevJieQi.getName();
                    }

                    const lunarText = `${gzYear}, ${shengXiao}年${lunarMonth}月${lunarDay} | 節氣: ${jieQi || '--'}`;
                    document.getElementById('lunar-info').textContent = lunarText;
                }
            } catch (e) {}
        }

        function updateHolidayCountdown() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            
            const upcoming = hkHolidays.map(h => {
                const hDate = new Date(h.date);
                hDate.setHours(0, 0, 0, 0);
                return { ...h, diffDays: Math.round((hDate - today) / (1000 * 60 * 60 * 24)) };
            }).filter(h => h.diffDays >= 0).sort((a, b) => a.diffDays - b.diffDays);
            
            const el = document.getElementById('holiday-countdown');
            if (upcoming.length > 0) {
                const next = upcoming[0];
                let timeText = next.diffDays === 0 ? '就是今天！' : `${next.diffDays} 日後`;
                el.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <span style="font-size: 0.85rem; color: #9ca3af;">最近假期: <span style="color: var(--accent-blue); font-weight: bold;">${next.name}</span></span>
                        <span style="font-size: 0.95rem; font-weight: 800; color: var(--accent-yellow);">${timeText}</span>
                    </div>
                `;
            }
        }

        async function fetchWeather() {
            try {
                const tempRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=rhrread&lang=tc');
                const tempData = await tempRes.json();
                
                if (tempData?.temperature?.data) {
                    const shatin = tempData.temperature.data.find(i => i.place === "沙田");
                    if (shatin) document.getElementById('current-temp').textContent = shatin.value + '°C';
                }

                if (tempData?.humidity?.data) {
                    const shatinHumid = tempData.humidity.data.find(i => i.place === "沙田") || tempData.humidity.data[0];
                    if (shatinHumid) document.getElementById('current-humidity').textContent = shatinHumid.value + '%';
                }

                if (tempData?.icon && tempData.icon.length > 0) {
                    const iconCode = tempData.icon[0];
                    const iconImg = document.getElementById('wx-icon-img');
                    iconImg.src = `https://www.hko.gov.hk/images/wxicon/pic${iconCode}.png`;
                    iconImg.style.display = 'block';
                }

                const fRes = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=tc');
                const fData = await fRes.json();
                if (fData?.weatherForecast?.length > 0) {
                    const nowStr = new Date().toISOString().slice(0,10).replace(/-/g,'');
                    let todayFc = fData.weatherForecast.find(f => f.forecastDate === nowStr) || fData.weatherForecast[0];
                    if (todayFc) {
                        document.getElementById('wx-max').textContent = todayFc.forecastMaxtemp.value + '°C';
                        document.getElementById('wx-min').textContent = todayFc.forecastMintemp.value + '°C';
                        
                        if (todayFc.PSR) {
                            document.getElementById('wx-rain').textContent = todayFc.PSR;
                        }
                    }
                }
            } catch (e) {}
            fetchWeatherWarnings();
        }

        async function fetchWeatherWarnings() {
            const warningBox = document.getElementById('weather-warning-box');
            try {
                const res = await fetch('https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=warnsum&lang=tc');
                if (res.ok) {
                    const data = await res.json();
                    let warningHtml = '';
                    for (const key in data) {
                        if (data[key] && data[key].name) {
                            warningHtml += `<span class="warning-badge">⚠️ ${data[key].name}</span>`;
                        }
                    }
                    warningBox.innerHTML = warningHtml;
                    warningBox.style.display = warningHtml ? 'flex' : 'none';
                }
            } catch (err) { warningBox.style.display = 'none'; }
        }

        async function fetchMTR() {
            const container = document.getElementById('mtr-eta-list');
            try {
                const res = await fetch('https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=TML&sta=HEO');
                const json = await res.json();
                if (json.status === 1 && json.data) {
                    const stationData = json.data['TML-HEO'];
                    if (!stationData) {
                        container.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 10px;">暫無列車資料</div>';
                        return;
                    }

                    const destMap = { 'WKS': '烏溪沙', 'MOS': '馬鞍山', 'TUM': '屯門', 'HUH': '紅磡', 'ETS': '尖東', 'KAT': '啟德', 'DIH': '鑽石山' };
                    
                    let allTrains = [];
                    (stationData.DOWN || []).forEach(t => allTrains.push({ ...t, defaultDest: '屯門' }));
                    (stationData.UP || []).forEach(t => allTrains.push({ ...t, defaultDest: '烏溪沙' }));
                    
                    // 按時間先後排序
                    allTrains.sort((a, b) => new Date(a.time.replace(/-/g, '/')) - new Date(b.time.replace(/-/g, '/')));
                    const top4Trains = allTrains.slice(0, 4);

                    let html = '<div class="mtr-grid">';
                    for (let i = 0; i < 4; i++) {
                        html += renderMtrSquare(top4Trains[i], destMap);
                    }
                    html += '</div>';
                    
                    container.innerHTML = html;
                }
            } catch (e) {}
        }

        // 渲染 4 個正方格中的單個列車卡片
        function renderMtrSquare(t, destMap) {
            if (!t) {
                return `
                    <div class="mtr-square-card" style="opacity: 0.3; justify-content: center;">
                        <span style="font-size: 0.85rem; color: #9ca3af;">暫無班次</span>
                    </div>
                `;
            }
            const destName = destMap[t.dest] || t.dest || t.defaultDest;
            const trainTime = new Date(t.time.replace(/-/g, '/'));
            const diffMin = Math.round((trainTime - new Date()) / 60000);
            
            const hours = String(trainTime.getHours()).padStart(2, '0');
            const mins = String(trainTime.getMinutes()).padStart(2, '0');
            const clockTime = `${hours}:${mins}`;
            
            const timeText = diffMin <= 0 ? '即到' : `${diffMin} 分`;
            const destColor = (t.dest === 'WKS' || destName === '烏溪沙') ? 'var(--accent-blue)' : 'var(--accent-purple)';

            return `
                <div class="mtr-square-card">
                    <span style="font-size: 0.9rem; color: ${destColor}; font-weight: bold;">往 ${destName}</span>
                    <div style="font-size: 1.25rem; color: var(--accent-green); font-weight: 800; margin: 2px 0;">${timeText}</div>
                    <span style="font-size: 0.9rem; color: var(--accent-yellow); font-weight: bold;">${clockTime}</span>
                </div>
            `;
        }

        function getStoredBusRoutes() {
            const saved = localStorage.getItem('custom_bus_routes');
            if (saved) { try { return JSON.parse(saved); } catch (e) {} }
            return [
                { route: '85K', stop: '003345', name: '錦鞍苑往沙田' },
                { route: '681', stop: '003345', name: '錦鞍苑往港島' }
            ];
        }

        async function fetchBusETA() {
            const container = document.getElementById('bus-eta-list');
            const routes = getStoredBusRoutes();
            if (routes.length === 0) return;

            let htmlContent = '';
            for (let i = 0; i < routes.length; i++) {
                let r = routes[i];
                try {
                    let etas = [];
                    for (let st = 1; st <= 2; st++) {
                        const res = await fetch(`https://data.etabus.gov.hk/v1/transport/kmb/eta/${r.stop}/${r.route}/${st}`);
                        if (res.ok) {
                            const data = await res.json();
                            if (data && data.data) etas = etas.concat(data.data);
                        }
                    }
                    
                    let etasListHtml = '';
                    if (etas && etas.length > 0) {
                        const validEtas = etas.filter(e => e.eta);
                        if (validEtas.length > 0) {
                            validEtas.sort((a, b) => new Date(a.eta) - new Date(b.eta));
                            const uniqueEtas = [];
                            validEtas.forEach(e => {
                                const eTime = new Date(e.eta).getTime();
                                if (!uniqueEtas.some(existing => Math.abs(eTime - new Date(existing.eta).getTime()) < 60000)) {
                                    uniqueEtas.push(e);
                                }
                            });

                            etasListHtml = uniqueEtas.slice(0, 3).map((e, idx) => {
                                const nextTime = new Date(e.eta);
                                const diffMin = Math.round((nextTime - new Date()) / 60000);
                                const timeStr = diffMin <= 1 ? '將到' : `${diffMin}分鐘`;
                                const clockTime = `${String(nextTime.getHours()).padStart(2, '0')}:${String(nextTime.getMinutes()).padStart(2, '0')}`;

                                const rmkText = e.rmk_tc ? e.rmk_tc.trim() : '';
                                const isSpecial = (e.service_type > 1) || (rmkText !== '' && rmkText !== '原定班次' && rmkText.includes('特別'));
                                
                                return `
                                    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-top: 2px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 2px;">
                                        <span style="color: #9ca3af;">${idx + 1}: <strong style="color: var(--accent-green);">${timeStr}</strong> <span style="font-size: 0.75rem;">(${clockTime})</span></span>
                                        <div style="display: flex; gap: 3px; align-items: center;">
                                            <span class="status-pill ${isSpecial ? 'pill-active-special' : 'pill-dim'}">特別</span>
                                            <span class="status-pill ${!isSpecial ? 'pill-active-normal' : 'pill-dim'}">普通</span>
                                        </div>
                                    </div>
                                `;
                            }).join('');
                        } else { etasListHtml = '<div style="color: #9ca3af; font-size: 0.85rem;">暫無班次</div>'; }
                    } else { etasListHtml = '<div style="color: #9ca3af; font-size: 0.85rem;">暫無班次</div>'; }

                    htmlContent += `
                        <div class="transit-card">
                            <div style="flex: 1;">
                                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px;">
                                    <div style="display: flex; align-items: center; gap: 6px;">
                                        <span class="route-badge">${r.route}</span>
                                        ${r.name ? `<span style="font-size: 0.85rem; font-weight: bold; color: var(--accent-blue);">${r.name}</span>` : ''}
                                    </div>
                                    <button onclick="removeBusRoute(${i})" style="background:none; border:none; color:var(--accent-red); cursor:pointer; font-weight:bold;">✕</button>
                                </div>
                                <div>${etasListHtml}</div>
                            </div>
                        </div>
                    `;
                } catch (err) {}
            }
            container.innerHTML = htmlContent;
        }

        function addBusRoute() {
            const routeInput = document.getElementById('bus-route-input');
            const stopInput = document.getElementById('bus-stop-input');
            const nameInput = document.getElementById('bus-name-input');
            
            const routeVal = routeInput.value.trim().toUpperCase();
            if (!routeVal) return;
            
            let routes = getStoredBusRoutes();
            routes.push({ route: routeVal, stop: stopInput.value.trim() || '003345', name: nameInput.value.trim() });
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            
            routeInput.value = ''; nameInput.value = '';
            fetchBusETA();
        }

        function removeBusRoute(index) {
            let routes = getStoredBusRoutes();
            routes.splice(index, 1);
            localStorage.setItem('custom_bus_routes', JSON.stringify(routes));
            fetchBusETA();
        }

        async function loadMemosFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, { headers: { "X-Master-Key": MASTER_KEY } });
                const data = await res.json();
                if (Array.isArray(data.record)) {
                    renderMemos(data.record);
                    localStorage.setItem('cached_memos', JSON.stringify(data.record));
                }
            } catch (e) {
                const cached = localStorage.getItem('cached_memos');
                if (cached) renderMemos(JSON.parse(cached));
            }
        }

        async function saveMemosToCloud(memos) {
            localStorage.setItem('cached_memos', JSON.stringify(memos));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
                    body: JSON.stringify(memos)
                });
            } catch (e) {}
        }

        function renderMemos(memos) {
            const listEl = document.getElementById('memo-list');
            if (memos.length === 0) {
                listEl.innerHTML = '<div style="color: #9ca3af; text-align: center; padding: 4px; font-size: 0.85rem;">目前沒有備忘</div>';
                return;
            }
            listEl.innerHTML = memos.map((text, index) => `
                <div class="memo-item">
                    <span>• ${text}</span>
                    <div class="memo-actions">
                        <button class="memo-action-btn" onclick="moveMemo(${index}, -1)" ${index === 0 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬆</button>
                        <button class="memo-action-btn" onclick="moveMemo(${index}, 1)" ${index === memos.length - 1 ? 'style="opacity:0.3;pointer-events:none;"' : ''}>⬇</button>
                        <button class="memo-delete" onclick="deleteMemo(${index})">✕</button>
                    </div>
                </div>
            `).join('');
            window.currentMemos = memos; 
        }

        async function addMemo() {
            const input = document.getElementById('memo-input');
            if (!input.value.trim()) return;
            let memos = window.currentMemos || [];
            memos.push(input.value.trim());
            input.value = '';
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function moveMemo(index, direction) {
            let memos = window.currentMemos || [];
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= memos.length) return;
            const item = memos.splice(index, 1)[0];
            memos.splice(targetIndex, 0, item);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        async function deleteMemo(index) {
            let memos = window.currentMemos || [];
            memos.splice(index, 1);
            renderMemos(memos);
            await saveMemosToCloud(memos);
        }

        window.onload = function() {
            updateTime();
        };

        setInterval(updateTime, 1000);
        setInterval(fetchWeather, 600000); 
        setInterval(loadMemosFromCloud, 30000); 
        setInterval(fetchMTR, 30000);
        setInterval(fetchBusETA, 30000);

        updateTime(); 
        updateHolidayCountdown();
        fetchWeather();
        loadMemosFromCloud(); 
        fetchMTR();
        fetchBusETA();
    </script>
</body>
</html>
