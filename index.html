<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <title>星空個人 Dashboard - 完美還原版</title>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: rgba(255, 255, 255, 0.06); --text-main: #f3f4f6; --accent-blue: #60a5fa; --accent-green: #34d399; --accent-yellow: #fbbf24; --accent-purple: #c084fc; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; padding: 8px; margin: 0; font-size: 1.25rem; }
        
        .top-header { background: var(--card-bg); padding: 10px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); max-width: 1200px; margin: 0 auto 8px auto; display: flex; justify-content: space-between; align-items: center; }
        .clock { font-size: 3rem; font-weight: 800; color: var(--accent-blue); }
        .date-center { text-align: center; font-size: 1.2rem; }

        .main-grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 8px; max-width: 1200px; margin: auto; }
        .panel { background: var(--card-bg); padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 8px; }
        .panel-title { font-size: 1.3rem; color: var(--accent-green); font-weight: 700; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 6px; }
        
        .wx-temp { font-size: 2.8rem; font-weight: 800; color: var(--accent-yellow); }
        .forecast-row { display: flex; justify-content: space-between; background: rgba(0,0,0,0.25); padding: 6px 10px; border-radius: 8px; margin-top: 5px; font-weight: 600; }
        
        .transport-row { padding: 12px; margin: 8px 0; border-radius: 12px; font-weight: 700; background: rgba(255,255,255,0.05); border-left: 6px solid var(--accent-blue); }
        .sub-eta { font-size: 0.95rem; color: #9ca3af; font-weight: normal; margin-top: 4px; }
        
        .memo-input-box { display: flex; gap: 8px; margin-bottom: 8px; }
        .memo-input { flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); padding: 8px; border-radius: 8px; color: #fff; font-size: 1.1rem; }
        .memo-btn { background: var(--accent-green); border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="top-header">
        <div class="clock" id="clock">00:00:00</div>
        <div class="date-center">
            <div id="date-text">--</div>
            <div id="lunar-date" style="color:var(--accent-yellow);">農曆計算中...</div>
        </div>
    </div>

    <div class="main-grid">
        <div>
            <div class="panel">
                <div class="panel-title">☀️ 馬鞍山氣象</div>
                <div style="display:flex; align-items:center; gap:15px;">
                    <span class="wx-temp" id="current-temp">--°C</span>
                    <span style="font-size: 2.5rem;" id="wx-icon">⛅</span>
                </div>
                <div class="forecast-row"><span id="fc-1">明天: 晴間多雲</span></div>
                <div class="forecast-row"><span id="fc-2">後天: 部分陽光</span></div>
            </div>

            <div class="panel">
                <div class="panel-title">📝 雲端備忘錄</div>
                <div class="memo-input-box">
                    <input type="text" id="memo-input" class="memo-input" placeholder="新增備忘...">
                    <button class="memo-btn" onclick="addMemo()">新增</button>
                </div>
                <div id="memo-list"></div>
            </div>
        </div>

        <div>
            <div class="panel">
                <div class="panel-title">🚇 港鐵恆安站</div>
                <div class="transport-row">
                    <div style="display:flex; justify-content:space-between;"><span>往烏溪沙</span><span class="wx-temp" style="font-size:1.8rem;">3分</span></div>
                    <div class="sub-eta">後續: 5分, 12分</div>
                </div>
                <div class="transport-row" style="border-left-color: var(--accent-purple);">
                    <div style="display:flex; justify-content:space-between;"><span>往屯門</span><span class="wx-temp" style="font-size:1.8rem;">2分</span></div>
                    <div class="sub-eta">後續: 6分, 13分</div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-title">🚌 巴士 (89C)</div>
                <div class="transport-row" style="border-left-color: #f472b6;">
                    <div style="display:flex; justify-content:space-between;"><span>錦鞍苑往觀塘</span><span class="wx-temp" style="font-size:1.8rem;">15分</span></div>
                    <div class="sub-eta">後續: 25分, 45分</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('zh-HK');
            document.getElementById('date-text').textContent = now.toLocaleDateString('zh-HK', {month:'long', day:'numeric', weekday:'long'});
        }
        
        function addMemo() {
            const input = document.getElementById('memo-input');
            if(!input.value) return;
            const item = document.createElement('div');
            item.className = 'memo-item';
            item.innerHTML = `<div style="padding:6px; border-bottom:1px solid #333;">• ${input.value}</div>`;
            document.getElementById('memo-list').appendChild(item);
            input.value = '';
        }

        setInterval(updateTime, 1000);
        updateTime();
        // 氣象模擬
        document.getElementById('current-temp').textContent = '26°C';
    </script>
</body>
</html>
